route", "Креира Pinia store", "Ја поедноставува two-way врската на компонента (го крие <code>modelValue<\/code> + <code>update:modelValue<\/code>)", "Креира нова компонента"], "e": "Во детето <code>const model = defineModel()<\/code>, па <code>&lt;input v-model=\"model\"&gt;<\/code>. Родителот само <code>&lt;SearchField v-model=\"query\" /&gt;<\/code>."}, {"id": "v5-10", "t": "mcq", "q": "Сакаш <code>theme<\/code> да е достапен во компонента 5 нивоа подлабоко, без да го праќаш како prop низ секое ниво. Што користиш?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["<code>emit<\/code>", "<code>provide('theme', theme)<\/code> во предокот и <code>inject('theme')<\/code> во детето", "<code>v-model<\/code>", "<code>slot<\/code>"], "e": "provide/inject избегнува „prop drilling“. За голема глобална состојба се користи Pinia."}, {"id": "v5-11", "t": "mcq", "q": "Каква конвенција се препорачува за имиња на компоненти?", "code": null, "lang": "js", "run": false, "a": 0, "o": ["PascalCase: <code>UserCard.vue<\/code>", "Само мали букви", "snake_case: <code>user_card.vue<\/code>", "kebab-case: <code>user-card.vue<\/code>"], "e": "Креираш <code>UserCard.vue<\/code>, го импортираш во <code>&lt;script setup&gt;<\/code> и го користиш како <code>&lt;UserCard /&gt;<\/code>."}]}, {"id": "v6", "part": "vue", "title": "Реактивност: ref, reactive, computed, watch", "lesson": "<h3>Options API vs Composition API<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>Options API (стар стил, Vue 2)<\/th><th>Composition API (Vue 3)<\/th><\/tr><\/thead><tbody><tr><td>код групиран по <strong>тип<\/strong>: <code>data<\/code>, <code>methods<\/code>, <code>computed<\/code>, <code>watch<\/code><\/td><td>код групиран по <strong>цел<\/strong> (поврзана логика заедно) во <code>setup<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>И двата се поддржани во Vue 3. Лекцијата користи <strong>Composition API<\/strong>.<\/p>\n<h3><code>ref()<\/code><\/h3>\n<pre class=\"code\" data-lang=\"js\"><code>import { ref } from 'vue'\nconst count = ref(0)\ncount.value++          // во JS: .value<\/code><\/pre>\n<ul><li>За <strong>primitives и објекти<\/strong>.<\/li><li>Во script: <strong><code>.value<\/code><\/strong>. Во template: <strong>без <code>.value<\/code><\/strong> (автоматско одвиткување).<\/li><li>Под хаубата: ref е објект со getter/setter за <code>value<\/code> што ги известува претплатниците.<\/li><\/ul>\n<h3><code>reactive()<\/code><\/h3>\n<pre class=\"code\" data-lang=\"js\"><code>import { reactive, toRefs } from 'vue'\nconst state = reactive({ user: 'Ada', score: 3 })\nstate.score++                       // нема .value\nconst { score } = toRefs(state)     // destructuring што ја чува реактивноста<\/code><\/pre>\n<ul><li><strong>Proxy<\/strong> што ги пресретнува операциите на објектот (вклучително вгнездени).<\/li><li><strong>Внимание<\/strong>: обичен destructuring <code>const { score } = state<\/code> ја <strong>губи реактивноста<\/strong> (добиваш обичен број). Користи <code>toRefs<\/code>.<\/li><\/ul>\n<h3><code>computed()<\/code><\/h3>\n<pre class=\"code\" data-lang=\"js\"><code>const price = ref(50)\nconst quantity = ref(2)\nconst total = computed(() =&gt; price.value * quantity.value)   // 100<\/code><\/pre>\n<ul><li><strong>Изведена<\/strong> состојба, <strong>кеширана<\/strong>: се пресметува повторно само кога се менуваат <strong>зависностите<\/strong> што ги чита.<\/li><li>За филтрирање, збирови.<\/li><li><strong>Без side effects<\/strong> (без fetch, без менување на други refs). Треба да е чиста функција.<\/li><li>Пристап во JS: <code>total.value<\/code>.<\/li><\/ul>\n<h3><code>watch()<\/code> и <code>watchEffect()<\/code><\/h3>\n<pre class=\"code\" data-lang=\"js\"><code>import { ref, watch, watchEffect } from 'vue'\nconst query = ref('')\n\nwatch(query, (newVal, oldVal) =&gt; {\n  console.log('changed from', oldVal, 'to', newVal)\n})\n\nwatchEffect(() =&gt; {\n  console.log('Current search:', query.value)   // автоматски следи query\n})<\/code><\/pre>\n<ul><li><code>watch<\/code>: <strong>експлицитен извор<\/strong>, добиваш <strong>стара и нова<\/strong> вредност. Не се извршува веднаш (по default).<\/li><li><code>watchEffect<\/code>: <strong>автоматски<\/strong> ги следи зависностите што ги чита, и се извршува <strong>веднаш<\/strong> еднаш.<\/li><li>За side effects (log, fetch, validacija). Чисти асинхрони ефекти.<\/li><li>Не менувај signal во watcher што го чита истиот signal (бесконечна јамка). Изведени вредности → <code>computed<\/code>.<\/li><\/ul>\n<h3>Кога што?<\/h3>\n<ul><li>Вредност што ја менува корисник/мрежа → <code>ref<\/code>/<code>reactive<\/code>.<\/li><li>Вредност <strong>изведена<\/strong> од други → <code>computed<\/code>.<\/li><li>Треба да <strong>направиш нешто<\/strong> кога нешто се смени → <code>watch<\/code>/<code>watchEffect<\/code>.<\/li><\/ul>", "qs": [{"id": "v6-1", "t": "mcq", "q": "Која е разликата меѓу Options API и Composition API?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["Composition API работи само во Vue 2", "Нема разлика", "Options API нема реактивност", "Options групира код по тип (<code>data<\/code>, <code>methods<\/code>, <code>computed<\/code>); Composition групира поврзана логика заедно во <code>setup<\/code>"], "e": "И двата се поддржани во Vue 3. Composition API е подобар за повеќекратна логика (composables)."}, {"id": "v6-2", "t": "mcq", "q": "<code>const count = ref(0)<\/code>. Како го зголемуваш во JavaScript (во <code>&lt;script setup&gt;<\/code>)?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["<code>count++<\/code>", "<code>this.count++<\/code>", "<code>count.value++<\/code>", "<code>count.set(count + 1)<\/code>"], "e": "Во JS мора <code>.value<\/code>. Во template пишуваш само <code>count<\/code>."}, {"id": "v6-3", "t": "mcq", "q": "Што ќе прикаже?", "code": "<script setup>\nimport { ref, computed } from 'vue'\nconst count = ref(3)\nconst doubled = computed(() => count.value * 2)\n<\/script>\n<template><p>{{ count }} / {{ doubled }}<\/p><\/template>", "lang": "vue", "run": false, "a": 2, "o": ["[object Object] / 6", "count / doubled", "3 / 6", "3 / 3"], "e": "Template ги одвиткува refs и computeds. <code>doubled<\/code> е <code>3 * 2 = 6<\/code>."}, {"id": "v6-4", "t": "mcq", "q": "Што е <code>reactive()<\/code>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Lifecycle hook", "Функција за HTTP барања", "<strong>Proxy<\/strong> околу објект што ги следи операциите на properties (без <code>.value<\/code>)", "Исто што и <code>ref<\/code>, но за strings"], "e": "<code>const state = reactive({ score: 3 }); state.score++<\/code>. Работи и со вгнездени објекти."}, {"id": "v6-5", "t": "mcq", "q": "<code>const state = reactive({ score: 3 }); const { score } = state;<\/code> Што е проблемот?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["Нема проблем", "<code>score<\/code> станува <code>undefined<\/code>", "<code>reactive<\/code> не дозволува destructuring (грешка)", "<code>score<\/code> е обичен број, <strong>ја губи реактивноста<\/strong>; треба <code>const { score } = toRefs(state)<\/code>"], "e": "Destructuring ја копира тековната вредност. <code>toRefs<\/code> прави ref за секое property, поврзан со оригиналот."}, {"id": "v6-6", "t": "mcq", "q": "Што е карактеристично за <code>computed()<\/code>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Се извршува на секој render без разлика", "Се користи за fetch барања", "<strong>Кеширана<\/strong> изведена вредност што се пресметува повторно само кога се менуваат зависностите", "Мора рачно да се повика"], "e": "Во примерот за performance, кликот на друг брояч <strong>не<\/strong> го пресметува повторно филтрираниот список, бидејќи <code>computed<\/code> не зависи од него."}, {"id": "v6-7", "t": "mcq", "q": "Што <strong>не<\/strong> треба да прави <code>computed()<\/code>?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Да враќа вредност", "Side effects (fetch, менување други refs, логирање)", "Да чита други refs", "Да филтрира низа"], "e": "Computed треба да е <strong>чиста<\/strong> функција. За side effects користи <code>watch<\/code>/<code>watchEffect<\/code>."}, {"id": "v6-8", "t": "mcq", "q": "Што нуди <code>watch<\/code> што <code>watchEffect<\/code> не нуди?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["Автоматско следење на зависности", "Кеширање", "Се извршува веднаш при креирање", "Експлицитен извор и пристап до <strong>старата и новата<\/strong> вредност"], "e": "<code>watch(query, (newV, oldV) =&gt; ...)<\/code>. <code>watchEffect<\/code> автоматски ги следи прочитаните зависности и се извршува веднаш."}, {"id": "v6-9", "t": "mcq", "q": "Корисникот куца во <code>&lt;input v-model=\"query\"&gt;<\/code>. Има <code>watch(query, (next, old) =&gt; { status.value = 'Changed from ' + old + ' to ' + next })<\/code>. Пишува „a“, па „ab“. Што е <code>status<\/code> после второто?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Type something", "Changed from a to ab", "Changed from  to a", "Changed from ab to a"], "e": "<code>watch<\/code> го добива новото (<code>\"ab\"<\/code>) и старото (<code>\"a\"<\/code>) при секоја промена."}, {"id": "v6-10", "t": "mcq", "q": "Price = 15, quantity = 2, tax = 0.18. Што прикажува <code>total<\/code> ако <code>subtotal = computed(() =&gt; price.value * quantity.value)<\/code> и <code>total = computed(() =&gt; (subtotal.value * (1 + tax.value)).toFixed(2))<\/code>?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["30.18", "35.4", "30", "35.40"], "e": "<code>subtotal = 30<\/code>, <code>30 * 1.18 = 35.4<\/code>, <code>.toFixed(2)<\/code> → <code>\"35.40\"<\/code> (string со 2 децимали). Computed може да зависи од друг computed."}]}, {"id": "v7", "part": "vue", "title": "Lifecycle, template refs и composables", "lesson": "<h3>Lifecycle на компонента<\/h3>\n<pre class=\"code\" data-lang=\"text\"><code>setup → beforeMount → mounted\nпромена на state → beforeUpdate → updated\nотстранување → beforeUnmount → unmounted<\/code><\/pre>\n<p>Во Composition API: <code>onMounted<\/code>, <code>onUpdated<\/code>, <code>onUnmounted<\/code>...<\/p>\n<ul><li><strong><code>onMounted<\/code><\/strong>: DOM-от е готов. Тука: фокус, мерења, <strong>fetch<\/strong>, <strong>addEventListener на window<\/strong>.<\/li><li><strong><code>onUnmounted<\/code><\/strong>: <strong>чистење<\/strong>: <code>removeEventListener<\/code>, clearInterval, abort на барања. Инаку memory leaks!<\/li><li><strong><code>nextTick()<\/code><\/strong>: чека Vue да ги примени закажаните DOM промени (ажурирањата се batched).<\/li><\/ul>\n<h3>Template refs (пристап до DOM елемент)<\/h3>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;script setup&gt;\nimport { ref, onMounted, onUnmounted } from 'vue'\nconst input = ref(null)            // ист име како ref=\"input\"\nconst width = ref(0)\nconst updateWidth = () =&gt; { width.value = window.innerWidth }\n\nonMounted(() =&gt; {\n  input.value.focus()              // елементот постои дури сега\n  updateWidth()\n  window.addEventListener('resize', updateWidth)\n})\nonUnmounted(() =&gt; window.removeEventListener('resize', updateWidth))\n&lt;/script&gt;\n&lt;template&gt;\n  &lt;input ref=\"input\" /&gt;\n  &lt;p&gt;Viewport: {{ width }}px&lt;/p&gt;\n&lt;/template&gt;<\/code><\/pre>\n<p>Забележи: истата функција <code>updateWidth<\/code> за add и remove (JS правилото од Events лекцијата!).<\/p>\n<h3>Composables<\/h3>\n<p>Функции <strong><code>useX()<\/code><\/strong> што ја пакуваат повеќекратната реактивна логика:<\/p>\n<pre class=\"code\" data-lang=\"js\"><code>// composables/useCounter.js\nimport { ref } from 'vue'\nexport function useCounter() {\n  const count = ref(0)\n  const increment = () =&gt; count.value++\n  return { count, increment }\n}<\/code><\/pre>\n<ul><li><strong>Секој повик прави независна состојба<\/strong> (како closure counter од JS!).<\/li><li>Ако сакаш <strong>заедничка<\/strong> состојба, мора експлицитно (пр. ref надвор од функцијата, или Pinia).<\/li><\/ul>\n<pre class=\"code\" data-lang=\"js\"><code>const a = useToggle()       // a.value = false\nconst b = useToggle(true)   // b.value = true, независно од a<\/code><\/pre>", "qs": [{"id": "v7-1", "t": "mcq", "q": "Кој lifecycle hook е правилен за код што зависи од <strong>DOM-от<\/strong> (фокус, мерење, addEventListener на window)?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["<code>computed<\/code>", "<code>onMounted<\/code>", "<code>onUnmounted<\/code>", "<code>setup<\/code> (директно)"], "e": "Во <code>setup<\/code> DOM-от уште не постои. По <code>mounted<\/code>, елементите се во страната."}, {"id": "v7-2", "t": "mcq", "q": "Зошто во примерот <code>onUnmounted(() =&gt; window.removeEventListener('resize', updateWidth))<\/code>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Затоа што <code>resize<\/code> не бубли", "Задолжително е за секоја компонента", "За чистење: без тоа listener-от останува на <code>window<\/code> и откако компонентата ќе исчезне (memory leak, грешки)", "За да се извика <code>updateWidth<\/code> уште еднаш"], "e": "Надворешни ресурси (listeners, тајмери) се чистат во <code>onUnmounted<\/code>. И мора да е <strong>истата<\/strong> функција."}, {"id": "v7-3", "t": "mcq", "q": "Кој е редоследот на lifecycle при прво прикажување?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["setup → mounted → beforeMount", "beforeMount → setup → mounted", "setup → beforeMount → mounted", "mounted → setup → beforeMount"], "e": "Потоа: промена → beforeUpdate → updated; отстранување → beforeUnmount → unmounted."}, {"id": "v7-4", "t": "mcq", "q": "Што е <code>const input = ref(null)<\/code> заедно со <code>&lt;input ref=\"input\" /&gt;<\/code>?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["Two-way binding на текстот", "Грешка, ref не прима null", "Props", "<strong>Template ref<\/strong>: по mount, <code>input.value<\/code> е вистинскиот DOM елемент"], "e": "Така можеш <code>input.value.focus()<\/code> во <code>onMounted<\/code>. Пред mount е <code>null<\/code>."}, {"id": "v7-5", "t": "mcq", "q": "Што прави <code>nextTick()<\/code>?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Го повторува последниот event", "Чека Vue да ги примени закажаните (batched) DOM ажурирања", "Чека 1 секунда", "Ја прави следната компонента"], "e": "По промена на state, DOM-от не се менува веднаш синхроно. <code>await nextTick()<\/code> и DOM-от е ажуриран."}, {"id": "v7-6", "t": "mcq", "q": "<code>const a = useToggle(); const b = useToggle(true);<\/code> Кликаш <code>a.toggle()<\/code>. Што е со <code>b.value<\/code>?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Грешка", "Останува <code>true<\/code>, секој повик на composable прави <strong>независна<\/strong> состојба", "Станува <code>undefined<\/code>", "Станува <code>false<\/code>"], "e": "Секој повик креира нов <code>ref<\/code> во своја closure. За заедничка состојба треба експлицитно споделување."}, {"id": "v7-7", "t": "mcq", "q": "Што е <strong>composable<\/strong>?", "code": null, "lang": "js", "run": false, "a": 0, "o": ["Функција (<code>useX<\/code>) што пакува повеќекратна реактивна логика и враќа state и акции", "Plugin за Vite", "CSS модул", "Компонента без template"], "e": "Пр. <code>useCounter()<\/code> враќа <code>{ count, increment }<\/code>. Конвенција: име почнува со <code>use<\/code>, се чува во <code>composables/<\/code>."}]}, {"id": "v8", "part": "vue", "title": "Routing, Pinia и fetch", "lesson": "<h3>SPA routing<\/h3>\n<ul><li>URL-то одговара на <strong>view<\/strong> во апликацијата.<\/li><li>Навигацијата <strong>не прави целосен reload<\/strong> на страната.<\/li><li><strong>History mode<\/strong> (<code>/users/5<\/code>) бара <strong>fallback на серверот<\/strong> (сите патеки → <code>index.html<\/code>), инаку refresh дава 404.<\/li><\/ul>\n<h3>Рачно hash routing (концепт)<\/h3>\n<pre class=\"code\" data-lang=\"js\"><code>const path = ref(window.location.hash || '#/home')\nconst sync = () =&gt; { path.value = window.location.hash || '#/home' }\nonMounted(() =&gt; window.addEventListener('hashchange', sync))\nonUnmounted(() =&gt; window.removeEventListener('hashchange', sync))\nconst page = computed(() =&gt;\n  path.value === '#/home' ? 'Home' : path.value === '#/about' ? 'About' : 'Not found')<\/code><\/pre>\n<p>Ова е само за учење. Во вистински проект: <strong>Vue Router<\/strong>.<\/p>\n<h3>Vue Router<\/h3>\n<pre class=\"code\" data-lang=\"js\"><code>import { createRouter, createWebHistory } from 'vue-router'\nimport HomeView from './views/HomeView.vue'\n\nconst router = createRouter({\n  history: createWebHistory(),\n  routes: [\n    { path: '/', component: HomeView },\n    { path: '/users/:id', component: () =&gt; import('./views/UserView.vue') }\n  ]\n})\nexport default router<\/code><\/pre>\n<ul><li><strong><code>&lt;RouterView /&gt;<\/code><\/strong>: место каде се прикажува тековната страна.<\/li><li><strong><code>&lt;RouterLink to=\"/about\"&gt;<\/code><\/strong>: линк без reload.<\/li><li><strong><code>:id<\/code><\/strong> = динамичен параметар (<code>/users/7<\/code> → id = 7).<\/li><li><code>() =&gt; import(...)<\/code>: <strong>lazy loading<\/strong>, компонентата се симнува дури кога треба.<\/li><\/ul>\n<h3>Сопственост на state<\/h3>\n<ol><li>Почни со <strong>локален state<\/strong> во компонентата.<\/li><li>Блиски компоненти: <strong>props / events<\/strong>.<\/li><li>Повеќе страни/views треба иста состојба: <strong>store<\/strong> (Pinia).<\/li><\/ol>\n<h3>Pinia<\/h3>\n<pre class=\"code\" data-lang=\"js\"><code>import { defineStore } from 'pinia'\nimport { ref, computed } from 'vue'\n\nexport const useCartStore = defineStore('cart', () =&gt; {\n  const items = ref([])                              // state\n  const count = computed(() =&gt; items.value.length)   // getter\n  function add(item) { items.value.push(item) }      // action\n  return { items, count, add }\n})<\/code><\/pre>\n<ul><li><strong>State<\/strong> е реактивен, <strong>getters<\/strong> се изведени вредности (computed), <strong>actions<\/strong> се бизнис операции.<\/li><li>Shared state без библиотека: еден <code>reactive({...})<\/code> објект (концепт, не замена за Pinia).<\/li><\/ul>\n<h3>Fetch во Vue (3 состојби: loading, error, data)<\/h3>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;script setup&gt;\nimport { ref, onMounted } from 'vue'\nconst users = ref([]), loading = ref(true), error = ref('')\nonMounted(async () =&gt; {\n  try {\n    const response = await fetch('https://jsonplaceholder.typicode.com/users')\n    if (!response.ok) throw new Error(`HTTP ${response.status}`)\n    users.value = await response.json()\n  } catch (e) { error.value = e.message }\n  finally { loading.value = false }\n})\n&lt;/script&gt;\n&lt;template&gt;\n  &lt;p v-if=\"loading\"&gt;Loading...&lt;/p&gt;\n  &lt;p v-else-if=\"error\"&gt;{{ error }}&lt;/p&gt;\n  &lt;ul v-else&gt;&lt;li v-for=\"user in users\" :key=\"user.id\"&gt;{{ user.name }}&lt;/li&gt;&lt;/ul&gt;\n&lt;/template&gt;<\/code><\/pre>\n<ul><li><strong><code>fetch<\/code> не фрла грешка за 404/500!<\/strong> Затоа проверка <code>response.ok<\/code>.<\/li><li><code>try/catch/finally<\/code>: мрежни/parse грешки, а <code>loading = false<\/code> секогаш.<\/li><li><code>AbortController<\/code> за откажување при unmount.<\/li><li>Архитектура: Components → Router/Pinia → <strong>service layer (fetch)<\/strong> → REST API. <strong>Никогаш тајни (API keys) во browser код!<\/strong><\/li><\/ul>\n<h3>Local CRUD<\/h3>\n<pre class=\"code\" data-lang=\"js\"><code>tasks.value.push({ id: nextId++, title })               // create\ntasks.value = tasks.value.filter(x =&gt; x.id !== id)      // delete<\/code><\/pre>", "qs": [{"id": "v8-1", "t": "mcq", "q": "Зошто SPA во <strong>history mode<\/strong> бара fallback на серверот?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["За побрзо вчитување", "Затоа што hash не работи", "На refresh на <code>/users/5<\/code>, серверот мора да врати <code>index.html<\/code>, инаку дава 404 (таа патека не постои како фајл)", "Не бара"], "e": "Рутите постојат само во JS апликацијата. Серверот треба сите патеки да ги пренасочи кон <code>index.html<\/code>."}, {"id": "v8-2", "t": "mcq", "q": "Што прави <code>&lt;RouterView /&gt;<\/code>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Прави HTTP барање", "Ги листа сите рути", "Тоа е местото каде се прикажува компонентата на тековната рута", "Прави линк"], "e": "<code>RouterLink<\/code> = навигација без reload, <code>RouterView<\/code> = место за прикажување."}, {"id": "v8-3", "t": "mcq", "q": "Рута <code>{ path: '/users/:id', ... }<\/code>. Што е <code>:id<\/code>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Задолжителен query string", "CSS класа", "<strong>Динамичен параметар<\/strong>: <code>/users/7<\/code> одговара и id е 7", "Id на HTML елемент"], "e": "Динамички патеки со params, пр. профил на корисник."}, {"id": "v8-4", "t": "mcq", "q": "Што значи <code>component: () =&gt; import('./views/UserView.vue')<\/code> во рута?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Компонентата се вчитува при старт", "Грешка, треба обичен import", "<strong>Lazy loading<\/strong>: компонентата се симнува дури кога рутата е посетена", "Компонентата се кешира засекогаш"], "e": "Динамичен <code>import()<\/code> враќа promise; помал почетен bundle."}, {"id": "v8-5", "t": "mcq", "q": "Кога се препорачува <strong>store<\/strong> (Pinia)?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Никогаш", "Кога повеќе компоненти/views треба иста состојба (cross-view); инаку локален state и props/events", "Секогаш, за секоја променлива", "Само за CSS"], "e": "Почни локално, props/events за блиски компоненти, store за споделена состојба на ниво на апликација."}, {"id": "v8-6", "t": "mcq", "q": "Во Pinia setup store, што одговара на <strong>getters<\/strong>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["<code>defineStore<\/code>", "функциите (<code>add<\/code>)", "<code>computed()<\/code> вредностите (пр. <code>count<\/code>)", "<code>ref()<\/code> променливите"], "e": "State = <code>ref<\/code>, getters = <code>computed<\/code>, actions = функции."}, {"id": "v8-7", "t": "mcq", "q": "Зошто во примерот има <code>if (!response.ok) throw new Error(...)<\/code>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["<code>response.ok<\/code> е задолжителен за <code>json()<\/code>", "Нема потреба, <code>fetch<\/code> секогаш фрла", "<code>fetch<\/code> <strong>не<\/strong> фрла грешка за HTTP грешки (404, 500), само за мрежни проблеми; мора рачно да се провери <code>ok<\/code>", "За да се прикаже loading"], "e": "Promise од <code>fetch<\/code> се resolve-ира и со 404. <code>response.ok<\/code> е <code>true<\/code> за статус 200-299."}, {"id": "v8-8", "t": "mcq", "q": "Зошто <code>loading.value = false<\/code> е во <code>finally<\/code>?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Без причина", "За loading да се исклучи <strong>и при успех и при грешка<\/strong>", "<code>try<\/code> не дозволува доделување", "Затоа што <code>finally<\/code> е побрзо"], "e": "Без <code>finally<\/code>, при грешка loading би останал <code>true<\/code> засекогаш."}, {"id": "v8-9", "t": "mcq", "q": "Што <strong>никогаш<\/strong> не треба да се става во browser (frontend) кодот?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Pinia store", "<code>fetch<\/code> повици", "Тајни (API keys, лозинки)", "Vue Router"], "e": "Сè што е во browser-от корисникот може да го види. Тајните се на серверот."}, {"id": "v8-10", "t": "mcq", "q": "Кој код правилно <strong>брише<\/strong> task со даден <code>id<\/code> од <code>tasks = ref([...])<\/code>?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["<code>delete tasks[id]<\/code>", "<code>tasks.value = tasks.value.filter(x =&gt; x.id !== id)<\/code>", "<code>tasks.filter(x =&gt; x.id !== id)<\/code>", "<code>tasks.value.remove(id)<\/code>"], "e": "<code>filter<\/code> враќа нова низа без тој елемент; ја доделуваме на <code>.value<\/code> и Vue го ажурира приказот."}]}, {"id": "v9", "part": "vue", "title": "Напредно: KeepAlive, Teleport, Transition, безбедност", "lesson": "<h3><code>&lt;KeepAlive&gt;<\/code><\/h3>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;KeepAlive&gt;\n  &lt;Editor :key=\"selected\" :label=\"selected\" /&gt;\n&lt;/KeepAlive&gt;<\/code><\/pre>\n<p>Нормално, кога компонента се менува, старата се <strong>unmount-ира<\/strong> и состојбата се губи. <code>KeepAlive<\/code> ги <strong>кешира<\/strong> инстанците, па кога ќе се вратиш на <code>A<\/code>, текстот што си го напишал е <strong>сè уште таму<\/strong>.<\/p>\n<h3><code>&lt;Teleport&gt;<\/code><\/h3>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;button @click=\"open = true\"&gt;Open dialog&lt;/button&gt;\n&lt;Teleport to=\"body\"&gt;\n  &lt;div v-if=\"open\" class=\"overlay\" @click.self=\"open = false\"&gt;\n    &lt;div class=\"modal\" role=\"dialog\" aria-modal=\"true\"&gt;...&lt;/div&gt;\n  &lt;/div&gt;\n&lt;/Teleport&gt;<\/code><\/pre>\n<p>Ја рендерира содржината <strong>на друго место во DOM-от<\/strong> (тука директно под <code>document.body<\/code>), иако логички припаѓа на компонентата. Идеално за <strong>modals<\/strong>, tooltips, notifications (избегнува проблеми со <code>overflow<\/code>/<code>z-index<\/code> на родителите). Пристапност: <code>role=\"dialog\"<\/code>, <code>aria-modal<\/code>.<\/p>\n<h3><code>&lt;Transition&gt;<\/code><\/h3>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;Transition name=\"fade\"&gt;\n  &lt;p v-if=\"show\"&gt;Animated content&lt;/p&gt;\n&lt;/Transition&gt;\n\n&lt;style&gt;\n.fade-enter-active, .fade-leave-active { transition: opacity .35s ease }\n.fade-enter-from, .fade-leave-to { opacity: 0 }\n&lt;/style&gt;<\/code><\/pre>\n<p>Додава CSS класи кога елемент <strong>влегува/излегува<\/strong> (<code>v-if<\/code>, <code>v-show<\/code>). Името <code>fade<\/code> е префикс на класите: <code>fade-enter-from<\/code>, <code>fade-enter-active<\/code>, <code>fade-leave-to<\/code>...<\/p>\n<h3>Безбедност: <code>v-html<\/code> и XSS<\/h3>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;pre&gt;{{ untrusted }}&lt;/pre&gt;        &lt;!-- безбедно: escape-ирано, се гледа како текст --&gt;\n&lt;div v-html=\"untrusted\"&gt;&lt;/div&gt;  &lt;!-- ОПАСНО: се парсира како HTML --&gt;<\/code><\/pre>\n<p>Ако <code>untrusted = '&lt;img src=x onerror=alert(1)&gt;'<\/code>, со <code>{{ }}<\/code> се гледа буквално текстот; со <code>v-html<\/code> скриптата се <strong>извршува<\/strong> (XSS). <strong>Никогаш не праќај недоверлива содржина во <code>v-html<\/code><\/strong> (исто како <code>innerHTML<\/code> во JS).<\/p>\n<h3>Performance<\/h3>\n<ul><li><code>computed<\/code> е кеширан: промена на <strong>неповрзана<\/strong> состојба (друг counter) не го пресметува повторно филтрираниот список.<\/li><li>Стабилни <code>:key<\/code> во <code>v-for<\/code>.<\/li><li>Мери: почетен bundle и hydration cost, вистински workloads; routing, rendering mode и зависности влијаат.<\/li><\/ul>", "qs": [{"id": "v9-1", "t": "mcq", "q": "Корисникот пишува текст во Editor A, префрла на B, па се враќа на A. Со <code>&lt;KeepAlive&gt;<\/code> околу Editor, што се случува?", "code": null, "lang": "js", "run": false, "a": 0, "o": ["Текстот во A е сè уште таму, бидејќи инстанцата е кеширана", "Грешка", "Текстот е избришан", "A и B го делат истиот текст"], "e": "Без KeepAlive, компонентата би се unmount-ирала и локалната состојба би се изгубила."}, {"id": "v9-2", "t": "mcq", "q": "Што прави <code>&lt;Teleport to=\"body\"&gt;<\/code>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Ја брише содржината", "Ја копира компонентата", "Ја рендерира содржината директно под <code>document.body<\/code> во DOM-от, иако е логички во компонентата", "Пренасочува кон друга страна"], "e": "Идеално за modals и overlays, за да не ги ограничуваат <code>overflow<\/code>/<code>z-index<\/code> на родителите."}, {"id": "v9-3", "t": "mcq", "q": "Со <code>&lt;Transition name=\"fade\"&gt;<\/code>, која класа го дефинира <strong>почетниот<\/strong> изглед при влегување?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["<code>.v-show<\/code>", "<code>.fade-enter-from<\/code>", "<code>.fade-in<\/code>", "<code>.fade-leave-active<\/code>"], "e": "<code>enter-from<\/code> → почетна состојба (пр. <code>opacity: 0<\/code>), <code>enter-active<\/code> → трајање/ease, <code>leave-to<\/code> → крајна состојба при излегување."}, {"id": "v9-4", "t": "mcq", "q": "<code>untrusted = '&lt;img src=x onerror=alert(1)&gt;'<\/code>. Кој приказ е <strong>безбеден<\/strong>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["И двата", "Ниту еден", "<code>{{ untrusted }}<\/code>", "<code>&lt;div v-html=\"untrusted\"&gt;<\/code>"], "e": "Interpolation escape-ира (се гледа како текст). <code>v-html<\/code> го парсира HTML-от и <code>onerror<\/code> би се извршил (XSS)."}, {"id": "v9-5", "t": "mcq", "q": "Во примерот за performance, кликаш копче што го зголемува неповрзан <code>count<\/code>. Што се случува со <code>filtered = computed(() =&gt; words.filter(...search...))<\/code>?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Се пресметува повторно", "<strong>Не<\/strong> се пресметува повторно, бидејќи не зависи од <code>count<\/code> (кеширан е)", "Се брише", "Фрла грешка"], "e": "Computed се пресметува само кога ќе се смени нешто што го чита (<code>search<\/code>)."}, {"id": "v9-6", "t": "mcq", "q": "За што е најпогоден <code>Teleport<\/code>?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["За HTTP барања", "За routing", "За состојба меѓу компоненти", "За modal дијалози, tooltips и notifications"], "e": "Логички дел од компонентата, физички на друго место во DOM-от."}]}], "cheat": {"js": "<h3>Coercion и споредба<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>Израз<\/th><th>Резултат<\/th><\/tr><\/thead><tbody><tr><td><code>1 + \"2\"<\/code><\/td><td><code>\"12\"<\/code> (<code>+<\/code> со string = concat)<\/td><\/tr><tr><td><code>\"6\" * \"2\"<\/code>, <code>\"5\" - 2<\/code><\/td><td><code>12<\/code>, <code>3<\/code> (други оператори = број)<\/td><\/tr><tr><td><code>2 * \"5px\"<\/code><\/td><td><code>NaN<\/code><\/td><\/tr><tr><td><code>\"\" - true<\/code><\/td><td><code>-1<\/code><\/td><\/tr><tr><td><code>[] + []<\/code><\/td><td><code>\"\"<\/code><\/td><\/tr><tr><td><code>3 == \"03\"<\/code> / <code>3 === \"03\"<\/code><\/td><td><code>true<\/code> / <code>false<\/code><\/td><\/tr><tr><td><code>null &gt;= 0<\/code> / <code>null == 0<\/code><\/td><td><code>true<\/code> / <code>false<\/code><\/td><\/tr><tr><td><code>0.1 + 0.2<\/code><\/td><td><code>0.30000000000000004<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>Falsy (6)<\/strong>: <code>false, \"\", 0, NaN, null, undefined<\/code>. Сè друго truthy (<code>\"0\"<\/code>, <code>[]<\/code>, <code>{}<\/code>).<\/li><li><code>a || b<\/code> враќа прв truthy (или последен), <code>a &amp;&amp; b<\/code> враќа прв falsy (или последен).<\/li><li><code>**<\/code> има највисок приоритет: <code>4 * 2 ** 3 + 10 = 42<\/code>.<\/li><li><code>Number(\"10\")<\/code>, <code>parseFloat(\"5px\") = 5<\/code>, <code>Boolean(x)<\/code> = <code>!!x<\/code>.<\/li><\/ul>\n<h3>Променливи и scope<\/h3>\n<ul><li><code>let<\/code> (block), <code>const<\/code> (block, нема reassignment, но <strong>mutation е ок<\/strong>), <code>var<\/code> (function scope, hoisted со <code>undefined<\/code>).<\/li><li><code>let<\/code>/<code>const<\/code> пред декларација → <code>ReferenceError: Cannot access 'x' before initialization<\/code>.<\/li><li><strong>Function declarations се hoisted<\/strong>; arrow/expression во <code>const<\/code> не се.<\/li><li><strong>Lexical scope<\/strong>: важи каде е <strong>напишана<\/strong> функцијата.<\/li><li><code>x = 1<\/code> без декларација → глобална (strict mode → грешка). Module = свој scope, strict, top-level <code>this<\/code> е <code>undefined<\/code>.<\/li><\/ul>\n<h3>Објекти и низи<\/h3>\n<ul><li>Непостоечки property → <code>undefined<\/code>. <code>undefined.x<\/code> → <strong>TypeError<\/strong>.<\/li><li><code>obj.x = undefined<\/code> го чува клучот; <code>delete obj.x<\/code> го брише.<\/li><li><code>obj[key]<\/code> = пресметан клуч; <code>obj.key<\/code> = буквално „key“.<\/li><li>Низите се објекти: именуван property не го менува <code>length<\/code>; индексите се string клучеви.<\/li><li>JSON: клучеви во <code>\"...\"<\/code>, само литерали.<\/li><li><code>null<\/code> = намерно празно; <code>undefined<\/code> = природно празно.<\/li><\/ul>\n<h3>DOM<\/h3>\n<ul><li><code>childNodes<\/code> (со текст) vs <code>children<\/code> (само елементи). <code>firstChild<\/code> може да е whitespace текст.<\/li><li><code>querySelector<\/code> (прв/null) vs <code>querySelectorAll<\/code> (сите, NodeList).<\/li><li><code>append<\/code> (внатре на крај), <code>before<\/code>/<code>after<\/code> (sibling), <code>replaceWith<\/code>, <code>remove<\/code>.<\/li><li><code>textContent<\/code> (текст, безбедно) vs <code>innerHTML<\/code> (парсира HTML, пресоздава → dangling refs).<\/li><li><code>classList.add/remove/contains/toggle<\/code>, <code>setAttribute<\/code>, <code>style.setProperty(\"--x\", 0.5)<\/code>.<\/li><li><code>for...in<\/code> = клучеви, <code>for...of<\/code> = вредности.<\/li><li><code>id=\"x\"<\/code> → глобална <code>x<\/code> (DOM clobbering).<\/li><\/ul>\n<h3>Events<\/h3>\n<ul><li><code>addEventListener<\/code> (многу) vs <code>onclick =<\/code> (само еден, пребришува).<\/li><li><code>removeEventListener<\/code> бара <strong>иста референца<\/strong> на функција.<\/li><li><code>target<\/code> = каде се случило (најдлабоко); <code>currentTarget<\/code> = каде е listener-от.<\/li><li>Фази: <strong>capture<\/strong> (надолу) → <strong>bubble<\/strong> (нагоре). <code>{ capture: true }<\/code>, <code>{ once: true }<\/code>.<\/li><li><strong>Не бублат<\/strong>: <code>focus<\/code>, <code>blur<\/code>, <code>mouseenter<\/code>, <code>mouseleave<\/code>, <code>load<\/code>, <code>error<\/code> → <code>focusin<\/code>, <code>focusout<\/code>, <code>mouseover<\/code>, <code>mouseout<\/code>.<\/li><li><code>stopPropagation()<\/code> = предците не слушаат. <code>preventDefault()<\/code> = без browser default (само ако <code>cancelable<\/code>).<\/li><li>Не-cancelable: <code>scroll<\/code>, <code>input<\/code>, <code>unload<\/code>, <code>resize<\/code>, <code>select<\/code>, <code>fullscreenchange<\/code>.<\/li><li>Delegation: listener на предок + <code>evt.target.matches(sel)<\/code> / <code>closest(sel)<\/code>. Работи за нови елементи.<\/li><li><code>el.value = ...<\/code> <strong>не<\/strong> пали <code>input<\/code>. <code>dispatchEvent(new InputEvent(\"input\"))<\/code>, <code>isTrusted<\/code> е <code>false<\/code>.<\/li><li><code>new CustomEvent(\"x\", { detail: {...} })<\/code>: податоците <strong>во <code>detail<\/code><\/strong>.<\/li><li>Raw: <code>keydown/keyup/mousemove/mousedown/mouseup<\/code>. Translated: <code>click/dblclick/input/mouseenter/mouseleave<\/code>.<\/li><\/ul>\n<h3>Функции<\/h3>\n<ul><li><code>handler<\/code> (референца) ✅ vs <code>handler()<\/code> (повик веднаш) ❌ во addEventListener.<\/li><li>Фалат аргументи → <code>undefined<\/code>. Default: <code>(x, y = x)<\/code>. Rest <code>(...args)<\/code> → низа. Spread <code>f(...arr)<\/code>.<\/li><li><code>() =&gt; ({ a: 1 })<\/code> враќа објект; <code>() =&gt; { a: 1 }<\/code> враќа <code>undefined<\/code>.<\/li><li><code>map<\/code> (нова низа), <code>filter<\/code> (truthy = задржи), <code>reduce((acc, cur) =&gt; ..., init)<\/code>, <code>find<\/code> (прв), <code>some<\/code>, <code>every<\/code>, <code>forEach<\/code> (→ <code>undefined<\/code>), <code>flatMap<\/code>.<\/li><li><code>sort()<\/code> <strong>мутира<\/strong>, stable, без comparator = string сортирање. Броеви: <code>(a, b) =&gt; a - b<\/code>.<\/li><li><code>slice(-n)<\/code> = последните n. <code>Math.max(...arr)<\/code>, <code>Math.max()<\/code> = <code>-Infinity<\/code>.<\/li><\/ul>\n<h3>Closures и this<\/h3>\n<ul><li>Closure = функција + околина; го гледа <strong>binding-от<\/strong> (тековна вредност).<\/li><li><code>for (var i...)<\/code> + async callback → сите го гледаат крајното <code>i<\/code>. <code>let<\/code> → нова <code>i<\/code> секоја итерација.<\/li><li><code>this<\/code> = објектот пред точката при <strong>повик<\/strong>. Обичен повик во module/strict → <code>undefined<\/code>.<\/li><li><strong>Arrow нема свој <code>this<\/code><\/strong> (го зема од околината).<\/li><li>Listener со <code>function<\/code> → <code>this === evt.currentTarget<\/code>.<\/li><li><code>call(ctx, a, b)<\/code>, <code>apply(ctx, [a, b])<\/code> = повик веднаш; <code>bind(ctx)<\/code> = нова функција, трајно.<\/li><li>Class: <code>#private<\/code> (пристап <code>this.#x<\/code>), <code>extends<\/code> + <code>super(...)<\/code>, static се наследува.<\/li><li>Getter: <code>get area() {}<\/code> без <code>()<\/code> при читање; само getter + доделување → TypeError (strict).<\/li><li>Modules: <code>export<\/code>/<code>import { a as b }<\/code>, се извршуваат еднаш.<\/li><\/ul>\n<h3>Async<\/h3>\n<ul><li>Редослед: <strong>sync → promises (microtasks) → setTimeout (tasks)<\/strong>.<\/li><li><code>then()<\/code> секогаш враќа нов promise. Return вредност → следниот then; return promise → се чека; нема return → <code>undefined<\/code>.<\/li><li><code>then(console.log(2))<\/code> → логира веднаш (не е функција).<\/li><li><code>then(ok, err)<\/code>, <code>catch(f)<\/code> = <code>then(x =&gt; x, f)<\/code>, <code>finally<\/code> пропушта вредност.<\/li><li><code>Promise.all<\/code> = паралелно, резултати <strong>по редослед на влезот<\/strong>, reject ако <strong>било кој<\/strong> reject.<\/li><li><code>Promise.race<\/code> = прв завршен. <code>Promise.resolve(x)<\/code>, <code>Promise.reject(e)<\/code>.<\/li><li><code>async<\/code> → секогаш promise. <code>await<\/code> паузира само таа функција. Rejected → exception (try/catch).<\/li><li>Две <code>await<\/code> по ред = секвенцијално; паралелно = <code>await Promise.all([...])<\/code>.<\/li><li><code>&lt;script defer&gt;<\/code> и <code>module<\/code>: по вчитување, по редослед. <code>async<\/code>: штом се симне, без редослед.<\/li><li>Busy-wait <code>while (!done) {}<\/code> блокира засекогаш. Polling → <code>clearInterval<\/code>. Listener <strong>пред<\/strong> почеток (race condition).<\/li><\/ul>", "vue": "<h3>Основи<\/h3>\n<ul><li>Прогресивен, <strong>декларативен<\/strong>, компонентен framework. Vue 3: Proxy реактивност, Composition API, TS.<\/li><li>MPA (нов HTML од сервер), SPA (client routing), SSR (сервер + hydration), SSG (pre-render при build).<\/li><li>Template → <strong>render функција<\/strong> → <strong>VNodes<\/strong> → patch на DOM. VDOM е стратегија, не втор DOM.<\/li><li><code>createApp(App).use(router).use(createPinia()).mount('#app')<\/code>.<\/li><li><code>npm create vue@latest<\/code> → <code>npm install<\/code> → <code>npm run dev<\/code> (HMR) → <code>npm run build<\/code> (<code>dist/<\/code>).<\/li><li>SFC = <code>&lt;script setup&gt;<\/code> + <code>&lt;template&gt;<\/code> + <code>&lt;style scoped&gt;<\/code>.<\/li><\/ul>\n<h3>Template<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>Синтакса<\/th><th>Кратенка<\/th><th>Значење<\/th><\/tr><\/thead><tbody><tr><td><code>{{ израз }}<\/code><\/td><td><\/td><td>текст (escape-иран)<\/td><\/tr><tr><td><code>v-bind:href=\"x\"<\/code><\/td><td><code>:href=\"x\"<\/code><\/td><td>атрибут/prop (JS израз)<\/td><\/tr><tr><td><code>v-on:click=\"f\"<\/code><\/td><td><code>@click=\"f\"<\/code><\/td><td>настан<\/td><\/tr><tr><td><code>v-slot:header<\/code><\/td><td><code>#header<\/code><\/td><td>named slot<\/td><\/tr><tr><td><code>v-if / v-else-if / v-else<\/code><\/td><td><\/td><td>креира/брише од DOM<\/td><\/tr><tr><td><code>v-show<\/code><\/td><td><\/td><td>само CSS <code>display<\/code><\/td><\/tr><tr><td><code>v-for=\"x in xs\" :key=\"x.id\"<\/code><\/td><td><\/td><td>листа, стабилен key<\/td><\/tr><tr><td><code>v-model<\/code><\/td><td><\/td><td>two-way (<code>:value<\/code> + <code>@input<\/code>)<\/td><\/tr><tr><td><code>v-html<\/code><\/td><td><\/td><td>сиров HTML, <strong>XSS опасност<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Модификатори: <code>.prevent<\/code>, <code>.stop<\/code>, <code>.once<\/code>, <code>.self<\/code>; <code>v-model.trim<\/code>, <code>.number<\/code>, <code>.lazy<\/code>.<\/li><li><code>:class=\"{ active: isOn }\"<\/code>, <code>:style=\"{ fontSize: '16px' }\"<\/code>.<\/li><li><code>age=\"24\"<\/code> = string; <code>:age=\"24\"<\/code> = број.<\/li><li><code>$event<\/code> = податок од emit / event објект.<\/li><\/ul>\n<h3>Реактивност<\/h3>\n<div class=\"tbl\"><table><thead><tr><th><\/th><th>Script<\/th><th>Template<\/th><\/tr><\/thead><tbody><tr><td><code>ref(0)<\/code><\/td><td><code>count.value<\/code><\/td><td><code>count<\/code><\/td><\/tr><tr><td><code>reactive({})<\/code><\/td><td><code>state.x<\/code> (без .value)<\/td><td><code>state.x<\/code><\/td><\/tr><tr><td><code>computed(() =&gt; ...)<\/code><\/td><td><code>total.value<\/code><\/td><td><code>total<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><code>computed<\/code>: кеширан, чист, без side effects.<\/li><li><code>watch(src, (newV, oldV) =&gt; ...)<\/code>: експлицитен извор, стара/нова вредност.<\/li><li><code>watchEffect(() =&gt; ...)<\/code>: авто следење, веднаш се извршува.<\/li><li>Destructuring на <code>reactive<\/code> ја губи реактивноста → <code>toRefs<\/code>.<\/li><li>Не менувај signal во watcher (јамка) → <code>computed<\/code>.<\/li><\/ul>\n<h3>Компоненти<\/h3>\n<ul><li><strong>Props down<\/strong> (<code>defineProps<\/code>, read-only), <strong>events up<\/strong> (<code>defineEmits<\/code>, <code>emit('x', data)<\/code>).<\/li><li>Slots: default <code>&lt;slot /&gt;<\/code>, named <code>&lt;slot name=\"h\" /&gt;<\/code> + <code>&lt;template #h&gt;<\/code>, scoped (детето праќа податоци).<\/li><li>Component v-model: <code>modelValue<\/code> + <code>update:modelValue<\/code>, или <code>defineModel()<\/code>.<\/li><li><code>provide(key, val)<\/code> / <code>inject(key)<\/code> против prop drilling. Глобално: Pinia.<\/li><\/ul>\n<h3>Lifecycle<\/h3>\n<ul><li>setup → beforeMount → <strong>mounted<\/strong> → (beforeUpdate → updated) → beforeUnmount → <strong>unmounted<\/strong>.<\/li><li><code>onMounted<\/code>: DOM, fetch, addEventListener. <code>onUnmounted<\/code>: чистење. <code>nextTick<\/code>: чека DOM ажурирање.<\/li><li>Template ref: <code>const el = ref(null)<\/code> + <code>ref=\"el\"<\/code> → <code>el.value<\/code> по mount.<\/li><li>Composable <code>useX()<\/code>: секој повик = независна состојба.<\/li><\/ul>\n<h3>Router, Pinia, fetch<\/h3>\n<ul><li><code>createRouter({ history: createWebHistory(), routes: [...] })<\/code>, <code>&lt;RouterView /&gt;<\/code>, <code>&lt;RouterLink to&gt;<\/code>, <code>/users/:id<\/code>, lazy <code>() =&gt; import(...)<\/code>.<\/li><li>History mode → server fallback на <code>index.html<\/code>.<\/li><li>Pinia: <code>defineStore('cart', () =&gt; { state=ref, getters=computed, actions=functions })<\/code>.<\/li><li>Fetch: <code>loading/error/data<\/code>, <code>if (!response.ok) throw<\/code>, <code>try/catch/finally<\/code>. Без тајни во frontend.<\/li><\/ul>\n<h3>Напредно<\/h3>\n<ul><li><code>&lt;KeepAlive&gt;<\/code>: кешира инстанци, состојбата останува.<\/li><li><code>&lt;Teleport to=\"body\"&gt;<\/code>: рендерира на друго место во DOM (modals).<\/li><li><code>&lt;Transition name=\"fade\"&gt;<\/code>: класи <code>fade-enter-from<\/code>, <code>fade-enter-active<\/code>, <code>fade-leave-to<\/code>.<\/li><\/ul>"}};
const SECS = DATA.sections;
const QMAP = {}; SECS.forEach(s => s.qs.forEach(q => { q.sec = s.id; QMAP[q.id] = q; }));
const SECMAP = Object.fromEntries(SECS.map(s => [s.id, s]));
const KEY = 'awd-midterm-quiz-v1';
let S = { ans: {}, wrong: {}, theme: null, view: null };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

let V = S.view || { tab: 'js', sec: null, mode: 'home', idx: 0 };

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const escH = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const KW = /^(const|let|var|function|return|if|else|for|of|in|while|new|class|extends|super|this|async|await|try|catch|finally|throw|typeof|instanceof|import|export|from|as|default|null|undefined|true|false|delete|static|get|set)$/;
function highlight(code) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->|#[^\n]*(?=\n|$)(?=)|`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|<\/?[A-Za-z][\w-]*|\/?>|\{\{|\}\}|\b\d+(?:\.\d+)?\b|\b[A-Za-z_$][\w$]*\b)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    const t = m[0];
    out += escH(code.slice(last, m.index)); last = m.index + t.length;
    let cls = '';
    if (t.startsWith('//') || t.startsWith('/*') || t.startsWith('<!--')) cls = 'c';
    else if (t[0] === '#') { out += escH(t); continue; }
    else if (/^[`"']/.test(t)) cls = 's';
    else if (t[0] === '<' || t === '>' || t === '/>') cls = 't';
    else if (t === '{{' || t === '}}') cls = 'p';
    else if (/^\d/.test(t)) cls = 'n';
    else if (KW.test(t)) cls = 'k';
    out += cls ? `<span class="tk-${cls}">${escH(t)}</span>` : escH(t);
  }
  return out + escH(code.slice(last));
}
function codeBlock(code, lang) { return `<pre class="code" data-lang="${lang || 'js'}"><code>${highlight(code)}</code></pre>`; }
function hlAll(root) {
  root.querySelectorAll('pre.code code:not([data-hl])').forEach(c => { c.innerHTML = highlight(c.textContent); c.dataset.hl = 1; });
}
function secStats(s) {
  let ok = 0, done = 0;
  s.qs.forEach(q => { const a = S.ans[q.id]; if (a) { done++; if (a.c) ok++; } });
  return { ok, done, n: s.qs.length };
}
function partStats(part) {
  let ok = 0, done = 0, n = 0;
  SECS.filter(s => s.part === part).forEach(s => { const t = secStats(s); ok += t.ok; done += t.done; n += t.n; });
  return { ok, done, n };
}
function go(v) { V = Object.assign({}, V, v); S.view = V; save(); render(); window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' }); }

// ---------- header ----------
function renderHeader() {

}

// ---------- main views ----------

function mobileSelect() {

function bindMobile() {

}

function viewHome() {
  const part = V.tab, secs = SECS.filter(s => s.part === part), t = partStats(part);
  const intro = part === 'js'
    ? `<div class="kicker">JavaScript · 4 MIT лекции + Zadaca 1 и 2</div><h1>Сите правила за JS, низ прашања</h1>
       <p>Секоја тема почнува со <strong>кратка лекција</strong> (правила + примери), па следат прашања: теорија и „Што печати кодот?“. По секој одговор добиваш објаснување, а кај кодот можеш да кликнеш <strong>▶ Изврши</strong> и да го видиш вистинскиот output (па и да го измениш кодот и да експериментираш).</p>
       <ol class="plan"><li>Лекциите читај ги брзо (2 до 3 мин по тема). Правилата се во жолтите кутии и табелите.</li><li>На прашањата прво размисли, па одговори. Тастатура: <b class="mono">1-4</b> за одговор, <b class="mono">Enter</b> за следно.</li><li>Згрешените одат во <strong>Мои грешки</strong>. На крај помини ги пак таму додека листата не се испразни.</li><li>Пред колоквиумот: 5 минути <strong>Cheat sheet</strong>.</li></ol>`
    : `<div class="kicker">Vue.js · од нула</div><h1>Vue за прв пат, објаснето чекор по чекор</h1>
       <p>Ова е напишано за некој што <strong>никогаш не користел Vue</strong>. Секоја лекција гради на претходната, па оди по редослед. Ќе видиш многу паралели со JS лекциите (events, closures, promises), бидејќи Vue е само JS што ја прави тешката DOM работа наместо тебе.</p>
       <ol class="plan"><li>Почни од <strong>1. Што е Vue</strong>, па редом.</li><li>Најважни за колоквиум: <strong>Template синтакса</strong>, <strong>v-if / v-for / v-model</strong>, <strong>Компоненти</strong> и <strong>Реактивност</strong>.</li><li>Кога ќе заглавиш, врати се на лекцијата со копчето <strong>📖 Лекција</strong>.</li></ol>`;
  return `<div class="card">${intro}
    <div class="row" style="margin-top:18px"><button class="btn" id="startBtn">${t.done ? 'Продолжи каде застана ▶' : 'Почни со првата тема ▶'}</button>

    <div class="card"><h2>Теми</h2><div class="grid">${secs.map((s, i) => {
      const st = secStats(s);
      return `<button class="tile" data-sec="${s.id}"><div class="tt">${i + 1}. ${escH(s.title)}</div>
        <div class="tm"><span>${st.n} прашања</span><span>${st.done === st.n ? '<span class="mini-ok">✓ ' + st.ok + '/' + st.n + '</span>' : st.done ? st.ok + '/' + st.n : ''}</span></div>
        <div class="bar" style="width:100%;margin-top:8px"><i style="width:${st.done / st.n * 100}%"></i></div></button>`;

    <div class="nav"><button class="btn" id="toQuiz">${st.done ? 'Продолжи со прашањата' : 'Почни квиз'} (${s.qs.length} прашања) ▶</button>

function questionHTML(q, picked, ctx) {
  const answered = picked !== undefined && picked !== null;
  const isOut = q.t === 'out';
  const letters = ['1', '2', '3', '4', '5'];
  const order = ctx.perm || q.o.map((_, i) => i);
  let opts = order.map((i, pos) => {
    const o = q.o[i];
    let cls = '';
    if (answered) { if (i === q.a) cls = 'ok'; else if (i === picked) cls = 'bad'; else cls = 'dim'; }
    return `<button class="opt ${cls}" data-i="${i}" ${answered ? 'disabled' : ''}><span class="key">${letters[pos]}</span><span class="val ${isOut ? 'mono' : ''}">${isOut ? escH(o) : o}</span></button>`;
  }).join('');
  let fb = '';
  if (answered) {
    const ok = picked === q.a;
    fb = `<div class="fb ${ok ? 'ok' : 'bad'}"><div class="v">${ok ? '✓ Точно!' : '✗ Не баш.'}</div>${q.e}</div>`;
    if (q.run && q.code) fb += `<div class="run"><div class="row"><button class="btn small" id="runBtn">▶ Изврши го кодот</button><button class="btn ghost small" id="editBtn">✎ Измени и експериментирај</button></div><div id="runArea"></div></div>`;
  }
  return `<div class="qhead">${ctx.head}<span class="chip type">${isOut ? 'Што печати кодот?' : (q.code ? 'Код + теорија' : 'Теорија')}</span></div>
    ${ctx.dots || ''}
    <div class="qtext">${q.q}</div>${q.code ? codeBlock(q.code, q.lang) : ''}
    <div class="opts">${opts}</div>${fb}`;
}
function bindRun(q) {
  const rb = $('#runBtn'); if (!rb) return;
  let editing = false;
  const area = $('#runArea');
  const exec = code => {
    let con = area.querySelector('.console');
    if (!con) { con = document.createElement('div'); con.className = 'console'; area.appendChild(con); }
    con.innerHTML = '<span class="hint">// output</span>\n';
    let any = false;
    runCode(code, (line, err) => { any = true; con.insertAdjacentHTML('beforeend', `<span class="${err ? 'err' : ''}">${escH(line)}</span>\n`); });
    setTimeout(() => { if (!any) con.insertAdjacentHTML('beforeend', '<span class="hint">(нема output)</span>'); }, 1200);
  };
  rb.onclick = () => exec(editing ? area.querySelector('textarea').value : q.code);
  $('#editBtn').onclick = () => {
    if (editing) return;
    editing = true;
    area.insertAdjacentHTML('afterbegin', `<textarea class="edit" spellcheck="false">${escH(q.code)}</textarea>`);
    rb.textContent = '▶ Изврши го изменетиот код';
  };
}
function viewQuiz() {
  const s = SECMAP[V.sec], q = s.qs[V.idx], a = S.ans[q.id];
  const dots = `<div class="dots">${s.qs.map((x, i) => { const r = S.ans[x.id]; return `<button data-j="${i}" class="${r ? (r.c ? 'ok' : 'bad') : ''} ${i === V.idx ? 'cur' : ''}" title="${i + 1}"></button>`; }).join('')}</div>`;
  const head = `<span class="chip">${escH(s.title)}</span><span class="chip">Прашање ${V.idx + 1} / ${s.qs.length}</span>`;
  const last = V.idx === s.qs.length - 1;
  return `<div class="card">${questionHTML(q, a ? a.p : null, { head, dots })}
    <div class="nav"><button class="btn ghost small" id="prevQ" ${V.idx === 0 ? 'disabled' : ''}>◀ Претходно</button>
    <button class="btn ghost small" id="toLesson">📖 Лекција</button><span class="spacer"></span>
    <span class="kbd"><b>1</b>-<b>4</b> одговор · <b>Enter</b> следно</span>
    <button class="btn small" id="nextQ">${last ? 'Резултат ▶' : 'Следно ▶'}</button></div></div>`;
}
function answer(q, i) {
  const c = i === q.a;
  S.ans[q.id] = { p: i, c };
  if (c) delete S.wrong[q.id]; else S.wrong[q.id] = 1;
  save();
}
function bindQuiz() {
  const s = SECMAP[V.sec], q = s.qs[V.idx];
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (S.ans[q.id]) return; answer(q, +b.dataset.i); render(); });
  document.querySelectorAll('.dots button').forEach(b => b.onclick = () => go({ idx: +b.dataset.j }));
  $('#prevQ').onclick = () => V.idx > 0 && go({ idx: V.idx - 1 });
  $('#nextQ').onclick = nextQ;
  $('#toLesson').onclick = () => go({ mode: 'lesson' });
  bindRun(q);
}
function nextQ() {
  const s = SECMAP[V.sec];
  if (V.idx < s.qs.length - 1) go({ idx: V.idx + 1 }); else go({ mode: 'summary' });
}
function viewSummary() {
  const s = SECMAP[V.sec], st = secStats(s);
  const secs = SECS.filter(x => x.part === s.part), i = secs.indexOf(s), next = secs[i + 1];
  const wrongs = s.qs.filter(q => S.ans[q.id] && !S.ans[q.id].c);
  const unanswered = st.n - st.done;
  const pct = st.n ? Math.round(st.ok / st.n * 100) : 0;
  const msg = pct >= 90 ? 'Одлично! Оваа тема ја имаш.' : pct >= 70 ? 'Добро! Помини ги грешките еднаш и готово.' : 'Врати се на лекцијата за момент, па вежбај ги грешките.';
  return `<div class="card"><div class="kicker">Крај на темата</div><h1>${escH(s.title)}</h1>
    <div class="score">${st.ok} / ${st.n}</div><p>${msg}${unanswered ? ` (${unanswered} неодговорени)` : ''}</p>
    <div class="row" style="margin-top:12px">
      ${next ? `<button class="btn" id="nextSec">Следна тема: ${escH(next.title)} ▶</button>` : `<button class="btn" id="partHome">Готово со ${s.part === 'js' ? 'JS' : 'Vue'} ▶</button>`}
      ${wrongs.length ? `<button class="btn ghost" id="practiceSec">Вежбај ги грешките (${wrongs.length})</button>` : ''}
      <button class="btn ghost" id="redo">Ресетирај и почни пак</button>
      <button class="btn ghost" id="lesson2">📖 Лекција</button>
    </div></div>`;
}
function bindSummary() {
  const s = SECMAP[V.sec], secs = SECS.filter(x => x.part === s.part), next = secs[secs.indexOf(s) + 1];
  if ($('#nextSec')) $('#nextSec').onclick = () => openSection(next.id);
  if ($('#partHome')) $('#partHome').onclick = () => go({ mode: 'home', sec: null });
  if ($('#practiceSec')) $('#practiceSec').onclick = () => startPractice(s.qs.filter(q => S.ans[q.id] && !S.ans[q.id].c).map(q => q.id));
  $('#redo').onclick = () => { s.qs.forEach(q => delete S.ans[q.id]); save(); go({ mode: 'quiz', idx: 0 }); };
  $('#lesson2').onclick = () => go({ mode: 'lesson' });
}

// ---------- mistakes ----------
function startPractice(ids) {
  const shuffled = ids.slice().sort(() => Math.random() - 0.5);
  const perms = {};
  shuffled.forEach(id => { perms[id] = QMAP[id].o.map((_, i) => i).sort(() => Math.random() - 0.5); });
  practice = { ids: shuffled, idx: 0, answered: {}, perms };
  go({ tab: 'mistakes', mode: 'practice' });
}
function viewMistakes() {
  const ids = Object.keys(S.wrong).filter(id => QMAP[id]);
  if (practice && V.mode === 'practice') return viewPractice();
  if (!ids.length) return `<div class="card"><div class="empty"><div class="big">🎉</div><h2>Немаш грешки за вежбање</h2><p>Секое погрешно одговорено прашање автоматски се додава тука. Кога ќе го одговориш точно овде, исчезнува од листата.</p></div></div>`;
  const bySec = {};
  ids.forEach(id => (bySec[QMAP[id].sec] = bySec[QMAP[id].sec] || []).push(id));
  return `<div class="card"><div class="kicker">Мои грешки</div><h1>${ids.length} прашања за повторување</h1>
    <p>Вежбај ги по случаен редослед. Точниот одговор го трга прашањето од листата.</p>
    <div class="row" style="margin-top:10px"><button class="btn" id="pAll">▶ Вежбај ги сите (${ids.length})</button>
    ${['js', 'vue'].map(p => { const n = ids.filter(id => SECMAP[QMAP[id].sec].part === p).length; return n ? `<button class="btn ghost" data-pp="${p}">Само ${p === 'js' ? 'JS' : 'Vue'} (${n})</button>` : ''; }).join('')}</div>
    <div class="mlist">${Object.entries(bySec).map(([sid, list]) => list.map(id => `<div class="mitem"><div class="ms">${escH(SECMAP[sid].title)}</div><div class="mq">${QMAP[id].q}</div></div>`).join('')).join('')}</div></div>`;
}
function bindMistakes() {
  if (practice && V.mode === 'practice') return bindPractice();
  const ids = Object.keys(S.wrong).filter(id => QMAP[id]);
  if ($('#pAll')) $('#pAll').onclick = () => startPractice(ids);
  document.querySelectorAll('[data-pp]').forEach(b => b.onclick = () => startPractice(ids.filter(id => SECMAP[QMAP[id].sec].part === b.dataset.pp)));
}
function viewPractice() {
  const P = practice;
  if (P.idx >= P.ids.length) {
    const ok = Object.values(P.answered).filter(Boolean).length;
    const left = Object.keys(S.wrong).length;
    return `<div class="card"><div class="kicker">Крај на вежбата</div><div class="score">${ok} / ${P.ids.length}</div>
      <p>${left ? `Остануваат уште ${left} во листата.` : 'Листата е празна. 🎉'}</p>
      <div class="row">${left ? '<button class="btn" id="again">Пак со останатите ▶</button>' : ''}<button class="btn ghost" id="backM">Назад</button></div></div>`;
  }
  const q = QMAP[P.ids[P.idx]];
  const picked = P.answered[q.id] === undefined ? null : P.picked;
  const head = `<span class="chip">Мои грешки</span><span class="chip">${escH(SECMAP[q.sec].title)}</span><span class="chip">${P.idx + 1} / ${P.ids.length}</span>`;
  return `<div class="card">${questionHTML(q, picked, { head, perm: P.perms[q.id] })}
    <div class="nav"><button class="btn ghost small" id="quit">Излези</button><span class="spacer"></span>
    <span class="kbd"><b>1</b>-<b>4</b> одговор · <b>Enter</b> следно</span>
    <button class="btn small" id="nextP" ${picked === null ? 'disabled' : ''}>Следно ▶</button></div></div>`;
}
function bindPractice() {
  const P = practice;
  if (P.idx >= P.ids.length) {
    if ($('#again')) $('#again').onclick = () => startPractice(Object.keys(S.wrong).filter(id => QMAP[id]));
    $('#backM').onclick = () => { practice = null; go({ mode: 'home' }); };
    return;
  }
  const q = QMAP[P.ids[P.idx]];
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (P.answered[q.id] !== undefined) return;
    const i = +b.dataset.i; P.picked = i; P.answered[q.id] = i === q.a;
    answer(q, i); render();
  });
  $('#quit').onclick = () => { practice = null; go({ mode: 'home' }); };
  $('#nextP').onclick = nextP;
  bindRun(q);
}
function nextP() { if (practice.answered[practice.ids[practice.idx]] === undefined) return; practice.idx++; practice.picked = null; render(); window.scrollTo(0, 0); }

// ---------- cheat ----------
function viewCheat() {
  return `<div class="card lesson"><div class="subtabs"><button class="btn small ${cheatPart === 'js' ? '' : 'ghost'}" data-cp="js">JavaScript</button><button class="btn small ${cheatPart === 'vue' ? '' : 'ghost'}" data-cp="vue">Vue.js</button></div>
  <div class="kicker">Брз преглед пред колоквиум</div><h1>${cheatPart === 'js' ? 'JavaScript' : 'Vue.js'} cheat sheet</h1>${DATA.cheat[cheatPart]}</div>`;
}
function bindCheat() { document.querySelectorAll('[data-cp]').forEach(b => b.onclick = () => { cheatPart = b.dataset.cp; render(); }); }

// ---------- render ----------
function render() {
  if (V.sec && !SECMAP[V.sec]) V = { tab: 'js', sec: null, mode: 'home', idx: 0 };
  if (V.mode === 'practice' && !practice) V.mode = 'home';
  renderHeader(); renderSide();
  const main = $('#main');
  let html = '', bind = () => {};
  if (V.tab === 'mistakes') { html = viewMistakes(); bind = bindMistakes; }
  else if (V.tab === 'cheat') { html = viewCheat(); bind = bindCheat; }
  else if (V.mode === 'home' || !V.sec) { html = viewHome(); bind = bindHome; }
  else if (V.mode === 'lesson') { html = viewLesson(); bind = bindLesson; }
  else if (V.mode === 'summary') { html = viewSummary(); bind = bindSummary; }
  else { html = viewQuiz(); bind = bindQuiz; }
  main.innerHTML = mobileSelect() + html;
  hlAll(main); bind(); bindMobile();
}
document.addEventListener('keydown', e => {
  if (e.target.matches('textarea, input, select')) return;
  const inQuiz = (V.tab === 'js' || V.tab === 'vue') && V.mode === 'quiz';
  const inP = V.tab === 'mistakes' && V.mode === 'practice' && practice && practice.idx < practice.ids.length;
  if (!inQuiz && !inP) return;
  if (/^[1-5]$/.test(e.key)) { const b = document.querySelectorAll('.opt')[+e.key - 1]; if (b && b.disabled) return; if (b) { e.preventDefault(); b.click(); } }
  else if (e.key === 'Enter' || e.key === 'ArrowRight') {
    if (inQuiz) { const q = SECMAP[V.sec].qs[V.idx]; if (S.ans[q.id] || e.key === 'ArrowRight') { e.preventDefault(); nextQ(); } }
    else { e.preventDefault(); nextP(); }
  } else if (e.key === 'ArrowLeft' && inQuiz && V.idx > 0) { e.preventDefault(); go({ idx: V.idx - 1 }); }
});
render();
</script>
</body>
</html>
