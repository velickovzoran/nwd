ата ја гледа новата вредност. (Затоа: преферирај <code>const<\/code>.)<\/li><li>Секој повик на <code>counter()<\/code> прави <strong>нова<\/strong> независна <code>i<\/code>.<\/li><\/ul>\n<h3>Класичниот loop gotcha<\/h3>\n<pre class=\"code\" data-lang=\"js\"><code>for (var i = 1; i &lt;= 3; i++) setTimeout(() =&gt; console.log(i));  // 4 4 4\nfor (let i = 1; i &lt;= 3; i++) setTimeout(() =&gt; console.log(i));  // 1 2 3<\/code><\/pre>\n<p><code>var<\/code> има <strong>една<\/strong> <code>i<\/code> за целиот loop (на крај е 4). <code>let<\/code> прави <strong>нова <code>i<\/code> за секоја итерација<\/strong>.<\/p>\n<h3><code>this<\/code><\/h3>\n<p><code>this<\/code> се одредува при <strong>повикот<\/strong> (dynamic binding), обично е објектот <strong>пред точката<\/strong>.<\/p>\n<ul><li>Метод <code>obj.f()<\/code> → <code>this<\/code> е <code>obj<\/code>.<\/li><li>Обичен повик <code>f()<\/code> во module/strict → <code>this<\/code> е <strong><code>undefined<\/code><\/strong>. (Без module: <code>window<\/code>.)<\/li><li>Во event listener со <code>function<\/code> → <code>this<\/code> е <code>evt.currentTarget<\/code> (елементот).<\/li><li><strong>Arrow функции немаат свој <code>this<\/code><\/strong>: го земаат од околината (лексички), како обична променлива.<\/li><\/ul>\n<pre class=\"code\" data-lang=\"js\"><code>btn.addEventListener(\"click\", function () {\n  setTimeout(function () { this.textContent = \"New\"; }, 100); // ❌ this е undefined\n  setTimeout(() =&gt; { this.textContent = \"New\"; }, 100);       // ✅ this е btn\n});<\/code><\/pre>\n<p>Рачно поставување на <code>this<\/code>:<\/p>\n<ul><li><code>f.call(ctx, a, b)<\/code> и <code>f.apply(ctx, [a, b])<\/code>: повикај веднаш со даден <code>this<\/code>.<\/li><li><code>f.bind(ctx)<\/code>: враќа <strong>нова функција<\/strong> со <strong>трајно<\/strong> врзан <code>this<\/code> (дури и <code>.call<\/code> не може да го смени).<\/li><li><code>let $$ = document.querySelectorAll; $$(\"div\")<\/code> → <code>Illegal invocation<\/code>. Решение: <code>.bind(document)<\/code>.<\/li><\/ul>\n<h3>Класи<\/h3>\n<pre class=\"code\" data-lang=\"js\"><code>class Person {\n  #secret = 42;                 // private, мора да се декларира\n  constructor(name) { this.name = name; }\n  greet() { return `Hi ${this.name}`; }\n}\nclass Student extends Person {\n  constructor(name) { super(name); }  // super = родителската класа\n}<\/code><\/pre>\n<ul><li><code>extends<\/code> наследува методи, properties, конструктор и static методи.<\/li><li>Private (<code>#<\/code>) не се достапни надвор ни во subclasses. Пристап: <code>this.#secret<\/code> (не <code>#secret<\/code>!).<\/li><li>Custom HTML елементи: <code>class X extends HTMLElement<\/code>, <code>customElements.define(\"click-counter\", X)<\/code>.<\/li><\/ul>\n<h3>Accessors (getters / setters)<\/h3>\n<p>„Properties однадвор, функции одвнатре.“<\/p>\n<pre class=\"code\" data-lang=\"js\"><code>let rect = {\n  w: 2, h: 3,\n  get area() { return this.w * this.h; },\n  set area(v) { this.h = v / this.w; }\n};\nrect.area;      // 6, без ()<\/code><\/pre>\n<p>Само getter + доделување → <code>TypeError<\/code> (во strict). Внимавај: луѓето мислат дека property е „евтин“, а getter-от може да е скап.<\/p>\n<h3>Modules<\/h3>\n<pre class=\"code\" data-lang=\"js\"><code>// square.js\nexport const name = \"square\";\nexport function draw() {}\n// main.js\nimport { name, draw } from \"./square.js\";\nimport { name as sq } from \"./square.js\";   // преименување<\/code><\/pre>\n<ul><li>Секој фајл е module со свој namespace; само <code>export<\/code>-ираното е видливо надвор.<\/li><li>Секој module се извршува <strong>само еднаш<\/strong>, иако е импортиран многу пати.<\/li><li>Top-level <code>this<\/code> во module е <code>undefined<\/code>.<\/li><\/ul>", "qs": [{"id": "j7-1", "t": "out", "q": "Што ќе испечати?", "code": "let i = 5;\nfunction logI() { console.log(i); }\nlogI();\ni = 6;\nlogI();", "lang": "js", "run": true, "a": 3, "o": ["6\n6", "5\n5", "undefined\n6", "5\n6"], "e": "Closure го гледа <strong>binding-от<\/strong> на <code>i<\/code>, не копија од вредноста. Кога <code>i<\/code> се менува, функцијата ја гледа новата вредност."}, {"id": "j7-2", "t": "out", "q": "Што ќе испечати?", "code": "let i = 5;\nfunction logI() { console.log(i); }\nlogI();\n{\n  let i = 6;\n  logI();\n}", "lang": "js", "run": true, "a": 0, "o": ["5\n5", "ReferenceError", "6\n6", "5\n6"], "e": "Внатрешното <code>let i<\/code> е <strong>друга<\/strong> променлива во друг блок. <code>logI<\/code> е дефинирана надвор и го гледа надворешното <code>i<\/code> (lexical scope)."}, {"id": "j7-3", "t": "out", "q": "Што ќе испечати?", "code": "for (var i = 1; i <= 3; i++) {\n  setTimeout(() => console.log(i));\n}", "lang": "js", "run": true, "a": 2, "o": ["1\n2\n3", "undefined\nundefined\nundefined", "4\n4\n4", "3\n3\n3"], "e": "<code>var<\/code> има <strong>една<\/strong> заедничка <code>i<\/code>. Callback-овите се извршуваат подоцна, кога loop-от веќе завршил и <code>i<\/code> е <code>4<\/code>."}, {"id": "j7-4", "t": "out", "q": "Што ќе испечати?", "code": "for (let i = 1; i <= 3; i++) {\n  setTimeout(() => console.log(i));\n}", "lang": "js", "run": true, "a": 3, "o": ["4\n4\n4", "3\n3\n3", "0\n1\n2", "1\n2\n3"], "e": "Со <code>let<\/code> секоја итерација добива <strong>нова<\/strong> <code>i<\/code>, па секој closure ја памети својата."}, {"id": "j7-5", "t": "out", "q": "Што ќе испечати?", "code": "function counter(start = 0) {\n  let i = start;\n  return () => ++i;\n}\nlet a = counter();\nlet b = counter(10);\nconsole.log(a(), a(), b(), a());", "lang": "js", "run": true, "a": 1, "o": ["0 1 10 2", "1 2 11 3", "1 1 11 1", "1 2 3 4"], "e": "Секој повик на <code>counter<\/code> прави <strong>нова<\/strong> <code>i<\/code>. <code>a<\/code> и <code>b<\/code> имаат независни состојби, а <code>i<\/code> преживува откако <code>counter<\/code> ќе заврши."}, {"id": "j7-6", "t": "out", "q": "Што ќе испечати? (кодот е во module, па top-level <code>this<\/code> е <code>undefined<\/code>)", "code": "const person = {\n  name: \"David\",\n  hi() { return this.name; },\n  hello: () => typeof this\n};\nconsole.log(person.hi(), person.hello());", "lang": "js", "run": true, "a": 2, "o": ["undefined David", "David David", "David undefined", "David object"], "e": "<code>hi<\/code> е обичен метод, <code>this<\/code> = <code>person<\/code>. <code>hello<\/code> е <strong>arrow<\/strong>: нема свој <code>this<\/code>, го зема од околината (top-level на module = <code>undefined<\/code>)."}, {"id": "j7-7", "t": "out", "q": "Што ќе испечати?", "code": "const obj = { name: \"Ada\", get() { return this.name; } };\nconst g = obj.get;\nconsole.log(obj.get());\nconsole.log(g());", "lang": "js", "run": true, "a": 1, "o": ["Ada\nundefined", "Ada\nTypeError: Cannot read properties of undefined (reading 'name')", "TypeError: Cannot read properties of undefined (reading 'name')", "Ada\nAda"], "e": "<code>obj.get()<\/code> → <code>this<\/code> = <code>obj<\/code>. <code>g()<\/code> е повик <strong>без објект пред точката<\/strong>, па во strict/module <code>this<\/code> е <code>undefined<\/code> и <code>undefined.name<\/code> фрла TypeError."}, {"id": "j7-8", "t": "out", "q": "Што ќе испечати?", "code": "function show() { return this.x; }\nconsole.log(show.call({ x: 1 }), show.apply({ x: 2 }));\nconst bound = show.bind({ x: 3 });\nconsole.log(bound(), bound.call({ x: 4 }));", "lang": "js", "run": true, "a": 0, "o": ["1 2\n3 3", "1 2\nundefined 4", "1 2\n3 4", "undefined undefined\n3 3"], "e": "<code>call<\/code>/<code>apply<\/code> повикуваат веднаш со даден <code>this<\/code>. <code>bind<\/code> враќа нова функција со <strong>трајно<\/strong> врзан <code>this<\/code>, дури и <code>.call<\/code> не го менува."}, {"id": "j7-9", "t": "out", "q": "Што ќе испечати?", "code": "let fakeArray = { 0: \"a\", 1: \"b\", length: 2 };\nconsole.log([].push.call(fakeArray, \"c\"));\nconsole.log(fakeArray);", "lang": "js", "run": true, "a": 2, "o": ["3\n{0: 'a', 1: 'b', length: 2}", "['a', 'b', 'c']", "3\n{0: 'a', 1: 'b', 2: 'c', length: 3}", "TypeError: fakeArray.push is not a function"], "e": "Го позајмуваме <code>push<\/code> од низа и го повикуваме со <code>this = fakeArray<\/code>. <code>push<\/code> враќа нова должина (<code>3<\/code>) и го менува објектот."}, {"id": "j7-10", "t": "out", "q": "Што ќе испечати?", "code": "const rect = { w: 2, h: 3, get area() { return this.w * this.h; } };\nconsole.log(rect.area);\nrect.w = 10;\nconsole.log(rect.area);", "lang": "js", "run": true, "a": 0, "o": ["6\n30", "6\n6", "ƒ\nƒ", "undefined\nundefined"], "e": "Getter се пристапува <strong>без <code>()<\/code><\/strong> и секогаш <strong>пресметува од тековната состојба<\/strong>."}, {"id": "j7-11", "t": "out", "q": "Што ќе испечати? (strict mode)", "code": "const rect = { w: 2, h: 3, get area() { return this.w * this.h; } };\nrect.area = 100;\nconsole.log(rect.area);", "lang": "js", "run": true, "a": 2, "o": ["undefined", "100", "TypeError: Cannot set property area of #<Object> which has only a getter", "6"], "e": "Само getter, нема setter: доделувањето во strict mode фрла TypeError."}, {"id": "j7-12", "t": "out", "q": "Што ќе испечати?", "code": "class Clicker {\n  #clicks = 0;\n  click() { return ++this.#clicks; }\n}\nconst c = new Clicker();\nc.click();\nconsole.log(c.click(), c.clicks);", "lang": "js", "run": true, "a": 3, "o": ["1 undefined", "2 0", "2 2", "2 undefined"], "e": "<code>#clicks<\/code> е <strong>private<\/strong>: пристап само внатре со <code>this.#clicks<\/code>. <code>c.clicks<\/code> (без <code>#<\/code>) е обичен непостоечки property → <code>undefined<\/code>."}, {"id": "j7-13", "t": "out", "q": "Што ќе испечати?", "code": "class PowerArray extends Array {\n  isEmpty() { return this.length === 0; }\n}\nconsole.log(PowerArray.from([1, 2]).isEmpty(), new PowerArray().isEmpty());", "lang": "js", "run": true, "a": 3, "o": ["true false", "TypeError: isEmpty is not a function", "false false", "false true"], "e": "<code>extends<\/code> наследува сè, вклучително <strong>static<\/strong> методи како <code>from<\/code>, кој враќа <code>PowerArray<\/code>. Затоа има <code>isEmpty<\/code>."}, {"id": "j7-14", "t": "mcq", "q": "Во click listener пишуваш <code>setTimeout(function () { this.textContent = \"New\"; }, 100)<\/code>. Зошто не работи и како се поправа?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["<code>textContent<\/code> не постои; користи <code>innerHTML<\/code>", "<code>setTimeout<\/code> не прима функции; користи string", "Треба <code>await<\/code> пред <code>setTimeout<\/code>", "Внатрешната <code>function<\/code> има свој <code>this<\/code> (<code>undefined<\/code> во module); поправка: arrow функција <code>() =&gt; { this.textContent = \"New\"; }<\/code>"], "e": "Arrow функциите го наследуваат <code>this<\/code> од околината (listener-от, каде <code>this<\/code> е копчето)."}, {"id": "j7-15", "t": "mcq", "q": "Зошто <code>let $$ = document.querySelectorAll; $$(\"div\")<\/code> фрла <code>Illegal invocation<\/code>?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["Затоа што е во strict mode", "<code>querySelectorAll<\/code> бара два аргумента", "<code>$$<\/code> е резервирано име", "<code>this<\/code> повеќе не е <code>document<\/code> при повикот; поправка: <code>document.querySelectorAll.bind(document)<\/code>"], "e": "Методот изгубил контекст. <code>bind<\/code> враќа нова функција со трајно врзан <code>this = document<\/code>."}, {"id": "j7-16", "t": "mcq", "q": "Што е точно за JS <strong>modules<\/strong>?", "code": null, "lang": "js", "run": false, "a": 0, "o": ["Само <code>export<\/code>-ираните имиња се видливи надвор, и секој module се извршува <strong>само еднаш<\/strong> иако е импортиран повеќе пати", "Не може да се преименува импорт", "<code>import<\/code> мора да е во функција", "Сите променливи во module се глобални"], "e": "Преименување: <code>import { obj as square } from './square.js'<\/code>. Module-ите се извршуваат еднаш и имаат свој namespace."}]}, {"id": "j8", "part": "js", "title": "Асинхроно програмирање", "lesson": "<h3>Зошто async?<\/h3>\n<p>JS работи на <strong>една нишка<\/strong> (single thread): една линија во даден момент. Долги задачи (тајмери, events, fetch, датотеки) ако се синхрони, би ја <strong>замрзнале<\/strong> страната.<\/p>\n<ul><li>Предности: паралелизам (10 барања одеднаш ≈ 10x побрзо), страната останува responsive.<\/li><li>Цена: треба да прикажеш „loading“, да паметиш што чекаш, кодот е потежок за следење и debug.<\/li><\/ul>\n<h3>Вчитување скрипти<\/h3>\n<ul><li><code>&lt;script defer&gt;<\/code>: се симнува паралелно, се извршува <strong>по<\/strong> вчитување на страната, <strong>по редослед<\/strong>.<\/li><li><code>&lt;script type=\"module\"&gt;<\/code>: имплицитно <strong>defer<\/strong>.<\/li><li><code>&lt;script async&gt;<\/code>: и симнување и извршување паралелно; <strong>редоследот не е гарантиран<\/strong>.<\/li><\/ul>\n<h3>Polling (лошо)<\/h3>\n<pre class=\"code\" data-lang=\"js\"><code>while (!img.complete) {}   // ❌ блокира засекогаш: главната нишка никогаш не се ослободува<\/code><\/pre>\n<p><code>setInterval(() =&gt; {...}, 250)<\/code> проверува периодично, но мора <code>clearInterval(id)<\/code> за да не продолжи засекогаш. Polling е потребен само за „некооперативни“ извори.<\/p>\n<h3>Events и race condition<\/h3>\n<p>Events „туркаат“ (push) информација наместо да ја „влечеш“ (pull).<\/p>\n<pre class=\"code\" data-lang=\"js\"><code>img.addEventListener(\"load\", init);  // прво listener\nimg.src = \"mine.jpg\";                // потоа почни вчитување<\/code><\/pre>\n<p>Ако е обратно, сликата може да се вчита <strong>пред<\/strong> да закачиш listener → <strong>race condition<\/strong>, никогаш не го слушаш настанот.<\/p>\n<h3>Callbacks → Callback Hell<\/h3>\n<pre class=\"code\" data-lang=\"js\"><code>getUser(\"jopo\", user =&gt; {\n  getUser(user.bestFriendId, friend =&gt; {\n    getUser(friend.bestFriendId, fof =&gt; console.log(fof.name));\n  });\n});<\/code><\/pre>\n<h3>Promises<\/h3>\n<p><strong>Promise<\/strong> = објект за работа што ќе заврши <strong>еднаш<\/strong>, <strong>некогаш<\/strong>. Состојби: pending → <strong>fulfilled<\/strong> (со вредност) или <strong>rejected<\/strong> (со грешка).<\/p>\n<pre class=\"code\" data-lang=\"js\"><code>getUser(\"jopo\")\n  .then(user =&gt; getUser(user.bestFriendId))\n  .then(friend =&gt; getUser(friend.bestFriendId))\n  .then(fof =&gt; console.log(fof.name));<\/code><\/pre>\n<p>Правила за <code>then()<\/code>:<\/p>\n<ul><li><code>then()<\/code> <strong>секогаш враќа нов promise<\/strong>.<\/li><li>Callback враќа promise → следниот <code>then<\/code> чека него.<\/li><li>Callback враќа обична вредност → завиткана во fulfilled promise.<\/li><li>Callback не враќа ништо → следниот добива <code>undefined<\/code>.<\/li><li><code>then<\/code> со аргумент што <strong>не е функција<\/strong> (пр. <code>then(console.log(2))<\/code>) → <code>console.log(2)<\/code> се извршува <strong>веднаш<\/strong>, а вредноста поминува понатаму.<\/li><li>Нема race condition: callback додаден по fulfillment се извршува веднаш (асинхроно).<\/li><\/ul>\n<p>Обвиткување на callback API: <code>new Promise(resolve =&gt; getUser(id, resolve))<\/code>.<\/p>\n<p>Грешки и помошни:<\/p>\n<ul><li><code>then(onOk, onError)<\/code>; <code>p.catch(f)<\/code> = <code>p.then(x =&gt; x, f)<\/code>; <code>p.finally(f)<\/code> за двата случаи.<\/li><li><code>Promise.all([p1, p2])<\/code>: паралелно, резултати <strong>по редослед на влезот<\/strong>; <strong>reject ако било кој reject<\/strong>.<\/li><li><code>Promise.race([...])<\/code>: првиот што ќе заврши. <code>Promise.resolve(x)<\/code>, <code>Promise.reject(e)<\/code>.<\/li><\/ul>\n<h3>async / await<\/h3>\n<p>Syntactic sugar над promises. <code>async<\/code> функција <strong>секогаш враќа promise<\/strong>. <code>await<\/code> ја паузира <strong>само таа функција<\/strong>, не главната нишка.<\/p>\n<pre class=\"code\" data-lang=\"js\"><code>async function show() {\n  try {\n    const user = await getUser(\"jopo\");\n    const friend = await getUser(user.bestFriendId);\n    console.log(user, friend.name);   // user е достапен насекаде\n  } catch (e) { console.log(e); }     // rejected promise → exception\n}<\/code><\/pre>\n<p>Два <code>await<\/code> еден по друг = <strong>секвенцијално<\/strong>. За паралелно: <code>await Promise.all([...])<\/code>.<\/p>\n<h3>Редослед на извршување (event loop)<\/h3>\n<ol><li>Целиот <strong>синхрон<\/strong> код прв.<\/li><li>Потоа promise callbacks (<code>then<\/code>, продолжение после <code>await<\/code>), т.н. <strong>microtasks<\/strong>.<\/li><li>Потоа тајмери (<code>setTimeout<\/code>, дури и со <code>0<\/code>ms), т.н. <strong>tasks<\/strong>.<\/li><\/ol>\n<h3>Реактивност (мост кон Vue)<\/h3>\n<ul><li><strong>Signal<\/strong> <code>ref()<\/code>: вредност што ја менува светот.<\/li><li><strong>Computation<\/strong> <code>computed()<\/code>: чиста изведена вредност.<\/li><li><strong>Effect<\/strong> <code>watchEffect()<\/code>: side effects (DOM, мрежа, log), се рестартира кога зависностите се менуваат.<\/li><li>Редослед: signal → computation → effect. <strong>Не менувај signal во effect<\/strong> (бесконечна јамка); користи <code>computed<\/code>.<\/li><\/ul>", "qs": [{"id": "j8-1", "t": "out", "q": "Што ќе испечати?", "code": "console.log(1);\nsetTimeout(() => console.log(2), 0);\nconsole.log(3);", "lang": "js", "run": true, "a": 2, "o": ["2\n1\n3", "1\n3", "1\n3\n2", "1\n2\n3"], "e": "<code>setTimeout<\/code> (дури и со 0ms) го закажува callback-от <strong>после<\/strong> целиот синхрон код."}, {"id": "j8-2", "t": "out", "q": "Што ќе испечати?", "code": "console.log(\"A\");\nsetTimeout(() => console.log(\"C\"));\nPromise.resolve().then(() => console.log(\"B\"));\nconsole.log(\"D\");", "lang": "js", "run": true, "a": 3, "o": ["A\nD\nC\nB", "A\nB\nC\nD", "A\nC\nB\nD", "A\nD\nB\nC"], "e": "Прво синхрониот код (A, D). Потоа promise callbacks (microtasks: B). На крај тајмерите (C)."}, {"id": "j8-3", "t": "mcq", "q": "Што се случува со <code>while (!img.complete) { }<\/code> по <code>img.src = \"...\"<\/code>?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Фрла грешка по 30 секунди", "<strong>Блокира засекогаш<\/strong>: главната нишка никогаш не излегува од јамката, па вчитувањето не може да заврши", "Работи, но е бавно", "Чека додека сликата не се вчита, па продолжува"], "e": "JS е single-threaded. Busy-wait не дозволува ништо друго да се изврши, вклучително и известувањето дека сликата е вчитана."}, {"id": "j8-4", "t": "mcq", "q": "Кодот поставува <code>img.src = url;<\/code> и <strong>потоа<\/strong> <code>img.addEventListener(\"load\", init);<\/code>. Кој е проблемот?", "code": null, "lang": "js", "run": false, "a": 0, "o": ["<strong>Race condition<\/strong>: сликата може да се вчита пред listener-от да е закачен, па <code>init<\/code> никогаш не се повикува", "Нема проблем", "<code>init<\/code> ќе се повика двапати", "<code>load<\/code> настан не постои за слики"], "e": "Прво закачи listener, потоа почни ја операцијата. Race условите се тешки за debug бидејќи редоследот варира."}, {"id": "j8-5", "t": "mcq", "q": "Кога користиш polling со <code>setInterval<\/code>, што мора да направиш кога условот ќе се исполни?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Ништо", "<code>return false<\/code>", "<code>clearInterval(id)<\/code>, инаку проверката (и <code>init()<\/code>) продолжува засекогаш", "<code>removeEventListener<\/code>"], "e": "<code>setInterval<\/code> враќа id; со <code>clearInterval(id)<\/code> го запираш. Polling е расипнички, користи events кога можеш."}, {"id": "j8-6", "t": "out", "q": "Што ќе испечати?", "code": "const wait = ms => new Promise(r => setTimeout(r, ms));\nwait(100)\n  .then(() => console.log(1))\n  .then(console.log(2))\n  .then(() => console.log(3));", "lang": "js", "run": true, "a": 0, "o": ["2\n1\n3", "2\n1", "1\n3", "1\n2\n3"], "e": "<code>then(console.log(2))<\/code> го <strong>повикува<\/strong> <code>console.log(2)<\/code> веднаш (при градење на синџирот) и подава <code>undefined<\/code> наместо функција. <code>then<\/code> без функција само ја пропушта вредноста, па по 100ms: 1, 3."}, {"id": "j8-7", "t": "out", "q": "Што ќе испечати?", "code": "Promise.resolve(2)\n  .then(x => x * 3)\n  .then(x => console.log(x));", "lang": "js", "run": true, "a": 1, "o": ["undefined", "6", "Promise {…}", "2"], "e": "Callback што враќа обична вредност → <code>then<\/code> ја завиткува во fulfilled promise, а следниот <code>then<\/code> ја добива."}, {"id": "j8-8", "t": "out", "q": "Што ќе испечати?", "code": "Promise.resolve(1)\n  .then(x => { x + 1; })\n  .then(v => console.log(v));", "lang": "js", "run": true, "a": 0, "o": ["undefined", "1", "2", "NaN"], "e": "Arrow со <code>{}<\/code> тело <strong>без <code>return<\/code><\/strong> враќа <code>undefined<\/code>. Следниот <code>then<\/code> добива <code>undefined<\/code>."}, {"id": "j8-9", "t": "out", "q": "Што ќе испечати?", "code": "Promise.reject(\"boom\")\n  .then(\n    v => { console.log(\"ok\"); return 0; },\n    e => { console.log(\"error: \" + e); return -1; }\n  )\n  .then(r => console.log(r));", "lang": "js", "run": true, "a": 1, "o": ["error: boom\n0", "error: boom\n-1", "ok\n0", "error: boom"], "e": "Rejected → се извршува вториот callback на <code>then<\/code>. Неговата <strong>return вредност<\/strong> (<code>-1<\/code>) оди во следниот <code>then<\/code> како нормален fulfillment."}, {"id": "j8-10", "t": "out", "q": "Што ќе испечати?", "code": "Promise.reject(new Error(\"x\"))\n  .then(() => console.log(\"then\"))\n  .catch(e => e.message)\n  .then(m => console.log(\"got\", m));", "lang": "js", "run": true, "a": 1, "o": ["got undefined", "got x", "Error: x", "then\ngot x"], "e": "Првиот <code>then<\/code> се прескокнува (нема error handler). <code>catch<\/code> ја фаќа грешката и враќа <code>\"x\"<\/code>, па синџирот продолжува нормално."}, {"id": "j8-11", "t": "out", "q": "Што ќе испечати?", "code": "const delay = (v, ms) => new Promise(r => setTimeout(() => r(v), ms));\nPromise.all([delay(\"a\", 300), delay(\"b\", 100)])\n  .then(r => console.log(r));", "lang": "js", "run": true, "a": 0, "o": ["['a', 'b']", "b", "a", "['b', 'a']"], "e": "<code>Promise.all<\/code> ги враќа резултатите <strong>по редослед на влезната низа<\/strong>, без разлика кој прв завршил."}, {"id": "j8-12", "t": "out", "q": "Што ќе испечати?", "code": "Promise.all([Promise.resolve(1), Promise.reject(\"fail\")])\n  .then(v => console.log(\"ok\", v))\n  .catch(e => console.log(\"caught\", e));", "lang": "js", "run": true, "a": 3, "o": ["ok [1]", "ok [1, 'fail']", "caught [1, 'fail']", "caught fail"], "e": "<code>Promise.all<\/code> се <strong>reject-ира ако било кој<\/strong> promise се reject-ира."}, {"id": "j8-13", "t": "out", "q": "Што ќе испечати?", "code": "const delay = (v, ms) => new Promise(r => setTimeout(() => r(v), ms));\nPromise.race([delay(\"slow\", 200), delay(\"fast\", 50)])\n  .then(v => console.log(v));", "lang": "js", "run": true, "a": 1, "o": ["['slow', 'fast']", "fast", "fast\nslow", "slow"], "e": "<code>Promise.race<\/code> завршува со <strong>првиот<\/strong> promise што ќе заврши."}, {"id": "j8-14", "t": "out", "q": "Што ќе испечати?", "code": "Promise.resolve(\"v\")\n  .finally(() => console.log(\"cleanup\"))\n  .then(v => console.log(v));", "lang": "js", "run": true, "a": 2, "o": ["v\ncleanup", "cleanup\nundefined", "cleanup\nv", "cleanup"], "e": "<code>finally<\/code> се извршува и при успех и при грешка, и <strong>ја пропушта<\/strong> оригиналната вредност понатаму."}, {"id": "j8-15", "t": "out", "q": "Што ќе испечати?", "code": "async function f() { return 5; }\nconsole.log(f() instanceof Promise);\nf().then(v => console.log(v));", "lang": "js", "run": true, "a": 1, "o": ["5\n5", "true\n5", "false\n5", "true\nPromise {…}"], "e": "<code>async<\/code> функција <strong>секогаш враќа promise<\/strong>, дури и кога враќаш обична вредност."}, {"id": "j8-16", "t": "out", "q": "Што ќе испечати?", "code": "async function main() {\n  console.log(\"1\");\n  await null;\n  console.log(\"3\");\n}\nmain();\nconsole.log(\"2\");", "lang": "js", "run": true, "a": 2, "o": ["2\n1\n3", "1\n2", "1\n2\n3", "1\n3\n2"], "e": "Кодот пред првиот <code>await<\/code> е синхрон. <code>await<\/code> ја паузира <strong>само <code>main<\/code><\/strong>, па се извршува <code>console.log(\"2\")<\/code>, потоа продолжува <code>main<\/code>."}, {"id": "j8-17", "t": "out", "q": "Што ќе испечати?", "code": "async function load() {\n  try {\n    await Promise.reject(new Error(\"404\"));\n    console.log(\"after\");\n  } catch (e) {\n    console.log(\"caught \" + e.message);\n  } finally {\n    console.log(\"done\");\n  }\n}\nload();", "lang": "js", "run": true, "a": 0, "o": ["caught 404\ndone", "caught 404", "after\ndone", "after\ncaught 404\ndone"], "e": "<code>await<\/code> на rejected promise <strong>фрла exception<\/strong>, па <code>try/catch<\/code> го фаќа. <code>finally<\/code> се извршува секогаш."}, {"id": "j8-18", "t": "mcq", "q": "Имаш <code>const a = await fetch(url1); const b = await fetch(url2);<\/code>. Како да ги направиш <strong>паралелни<\/strong>?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["Додај <code>async<\/code> пред <code>fetch<\/code>", "Користи <code>Promise.race<\/code>", "Не е можно", "<code>const [a, b] = await Promise.all([fetch(url1), fetch(url2)]);<\/code>"], "e": "Два <code>await<\/code> еден по друг се <strong>секвенцијални<\/strong>. <code>Promise.all<\/code> ги стартува двата одеднаш и чека двата."}, {"id": "j8-19", "t": "mcq", "q": "Кој <code>&lt;script&gt;<\/code> се симнува паралелно со страната, но извршувањето <strong>не е гарантирано по редослед<\/strong>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["<code>&lt;script&gt;<\/code> без атрибут", "<code>&lt;script type=\"module\"&gt;<\/code>", "<code>&lt;script async&gt;<\/code>", "<code>&lt;script defer&gt;<\/code>"], "e": "<code>defer<\/code> и <code>module<\/code> се извршуваат по вчитување на страната, по редослед. <code>async<\/code> се извршува штом се симне."}, {"id": "j8-20", "t": "mcq", "q": "Callback-от во <code>then<\/code> враќа <strong>promise<\/strong>. Што добива следниот <code>then<\/code>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Грешка", "<code>undefined<\/code>", "<strong>Резултатот<\/strong> на тој promise (чека да заврши)", "Самиот promise објект"], "e": "Ако callback врати promise, синџирот го „следи“ тој promise. Затоа <code>.then(user =&gt; getUser(...))<\/code> работи за chaining."}, {"id": "j8-21", "t": "mcq", "q": "Во реактивниот модел, кое е правилното мапирање?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Signal = <code>computed()<\/code>, Computation = <code>ref()<\/code>, Effect = <code>watch()<\/code>", "Signal = <code>ref()<\/code>, Computation = <code>computed()<\/code>, Effect = <code>watchEffect()<\/code>", "Signal = <code>watchEffect()<\/code>, Computation = <code>ref()<\/code>, Effect = <code>computed()<\/code>", "Сите три се <code>ref()<\/code>"], "e": "Signal ја држи состојбата, computation е чисто изведена вредност, effect прави side effects. Редослед: signal → computation → effect."}, {"id": "j8-22", "t": "mcq", "q": "Зошто е опасно <code>watchEffect(() =&gt; { state.value.total = state.value.todos.length })<\/code>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["<code>watchEffect<\/code> не прима arrow функции", "<code>length<\/code> не е реактивен", "Менување signal во effect може да го пушти истиот effect повторно (бесконечна јамка); изведена вредност треба <code>computed()<\/code>", "Нема ништо опасно"], "e": "Подобро: <code>const total = computed(() =&gt; state.value.todos.length)<\/code>. Signals се менуваат од „светот“ (input, мрежа, тајмери), не од effects."}]}, {"id": "j9", "part": "js", "title": "Практично: Zadaca 1 и 2", "lesson": "<h3>Зошто ова?<\/h3>\n<p>Двете задачи ги комбинираат сите лекции: <code>fetch<\/code> + <code>Promise.all<\/code>, array методи, closures и DOM. Тука се трикови што лесно се ставаат на колоквиум.<\/p>\n<h3>Zadaca 1 (TV серии): клучни моменти<\/h3>\n<ul><li>Глобална променлива <code>let shows = []<\/code> за да може филтрирање <strong>без нови HTTP барања<\/strong>.<\/li><li><code>Promise.all<\/code> за <strong>паралелни<\/strong> барања; резултатите се <strong>по редослед на URL-ите<\/strong>.<\/li><li>Отстранување дупликати со <code>reduce<\/code> во објект со клуч <code>show.id<\/code>. Строго <code>&gt;<\/code> го чува <strong>првиот<\/strong> при еднаков score (<code>&gt;=<\/code> би го чувал последниот).<\/li><li><code>select.value<\/code> е <strong>string<\/strong> (<code>\"7\"<\/code>), затоа <code>Number(...)<\/code>.<\/li><li><strong><code>null &gt;= 0<\/code> е <code>true<\/code><\/strong> во JS! Затоа експлицитна проверка <code>!== null<\/code>.<\/li><li><code>flatMap<\/code> спојува низи од жанрови, <code>new Set<\/code> отстранува дупликати, <code>sort()<\/code> сортира.<\/li><li><code>innerHTML = \"\"<\/code> за чистење, <code>textContent<\/code> за безбедно пишување текст.<\/li><\/ul>\n<h3>Zadaca 2 (временска прогноза): клучни моменти<\/h3>\n<ul><li>Open-Meteo враќа <strong>паралелни низи<\/strong> (<code>time[i]<\/code>, <code>temperature_2m[i]<\/code>...), ги спојуваме со <code>map((time, i) =&gt; ...)<\/code>.<\/li><li>Филтер со <code>!== null<\/code>, бидејќи <strong><code>0<\/code> врнежи е валидна вредност<\/strong> (falsy, ама не смее да се отфрли).<\/li><li><code>Math.max(...arr)<\/code> (spread). <code>Math.max()<\/code> без аргументи е <code>-Infinity<\/code>.<\/li><li><code>sort()<\/code> <strong>ја менува низата<\/strong> и е <strong>stable<\/strong> (еднаквите го чуваат редоследот). Без comparator сортира како <strong>strings<\/strong>.<\/li><li><code>Math.floor(hour / 6)<\/code> дава индекс на дел од денот (0 Ноќ, 1 Утро, 2 Попладне, 3 Вечер).<\/li><li><code>average([])<\/code> е <code>0 / 0 = NaN<\/code>, затоа празни групи се филтрираат.<\/li><li><code>every<\/code> + <code>some<\/code> за „секој град има барем еден час без дожд“.<\/li><li><code>createTemperatureMonitor(limit)<\/code>: <strong>closure<\/strong> што чува состојба; <code>slice(-limit)<\/code> ги чува последните <code>limit<\/code>; враќа <strong>копија<\/strong> <code>[...temps]<\/code> за надворешни промени да не ја расипат состојбата.<\/li><li><code>0.1 + 0.2 = 0.30000000000000004<\/code> (floating point).<\/li><\/ul>", "qs": [{"id": "j9-1", "t": "out", "q": "Што ќе испечати?", "code": "console.log(null >= 0, null > 0, null == 0);", "lang": "js", "run": true, "a": 3, "o": ["false false false", "true false true", "true true true", "true false false"], "e": "Чуден JS: <code>&gt;=<\/code> и <code>&gt;<\/code> го претвораат <code>null<\/code> во <code>0<\/code>, па <code>0 &gt;= 0<\/code> е <code>true<\/code>. Но <code>==<\/code> има посебно правило: <code>null<\/code> е еднаков само на <code>null<\/code>/<code>undefined<\/code>. Затоа во Zadaca 1 треба <code>rating !== null<\/code>."}, {"id": "j9-2", "t": "out", "q": "Што ќе испечати? (<code>v<\/code> е како <code>select.value<\/code>)", "code": "const v = \"7\";\nconsole.log(v + 1, Number(v) + 1);", "lang": "js", "run": true, "a": 3, "o": ["71 71", "8 8", "NaN 8", "71 8"], "e": "<code>select.value<\/code> е секогаш <strong>string<\/strong>. <code>\"7\" + 1<\/code> е concatenation. Затоа се користи <code>Number(...)<\/code> пред споредба/пресметка."}, {"id": "j9-3", "t": "out", "q": "Што ќе испечати?", "code": "const items = [\n  { id: 1, score: 0.5 }, { id: 2, score: 0.9 },\n  { id: 1, score: 0.8 }, { id: 2, score: 0.9 }\n];\nconst unique = items.reduce((result, item) => {\n  const prev = result[item.id];\n  if (!prev || item.score > prev.score) {\n    return { ...result, [item.id]: item };\n  }\n  return result;\n}, {});\nconsole.log(Object.values(unique).map(x => x.score));", "lang": "js", "run": true, "a": 2, "o": ["[0.5, 0.9]", "[0.5, 0.9, 0.8, 0.9]", "[0.8, 0.9]", "[0.8, 0.9, 0.9]"], "e": "Објект со клуч <code>id<\/code> чува секоја серија <strong>еднаш<\/strong>. За id 1 се зема поголемиот score (<code>0.8<\/code>). За id 2 е tie, а строгото <code>&gt;<\/code> го чува <strong>првиот<\/strong>. <code>[item.id]<\/code> е computed key, <code>...result<\/code> е object spread."}, {"id": "j9-4", "t": "out", "q": "Што ќе испечати?", "code": "const shows = [{ genres: [\"Drama\", \"Action\"] }, { genres: [\"Action\", \"Comedy\"] }];\nconsole.log([...new Set(shows.flatMap(s => s.genres))].sort());", "lang": "js", "run": true, "a": 2, "o": ["['Drama', 'Action', 'Comedy']", "['Drama', 'Action', 'Action', 'Comedy']", "['Action', 'Comedy', 'Drama']", "[['Drama', 'Action'], ['Action', 'Comedy']]"], "e": "<code>flatMap<\/code> ги спојува низите во една. <code>new Set<\/code> ги отстранува дупликатите. <code>[...set]<\/code> го враќа во низа, <code>sort()<\/code> азбучно."}, {"id": "j9-5", "t": "out", "q": "Што ќе испечати?", "code": "const a = [3, 1, 2];\nconst b = a.sort();\nconsole.log(a, a === b);", "lang": "js", "run": true, "a": 1, "o": ["[3, 1, 2] true", "[1, 2, 3] true", "[3, 1, 2] false", "[1, 2, 3] false"], "e": "<code>sort()<\/code> <strong>ја менува оригиналната низа<\/strong> и ја враќа истата референца. Затоа во Zadaca 2 sort се вика на новата низа од <code>map()<\/code>."}, {"id": "j9-6", "t": "out", "q": "Што ќе испечати?", "code": "console.log([10, 9, 1].sort(), [10, 9, 1].sort((a, b) => a - b));", "lang": "js", "run": true, "a": 0, "o": ["[1, 10, 9] [1, 9, 10]", "[1, 9, 10] [1, 9, 10]", "[10, 9, 1] [1, 9, 10]", "[1, 9, 10] [10, 9, 1]"], "e": "Без comparator, <code>sort<\/code> ги споредува како <strong>strings<\/strong> (<code>\"10\" &lt; \"9\"<\/code>). За броеви: <code>(a, b) =&gt; a - b<\/code> (растечки) или <code>b - a<\/code> (опаѓачки)."}, {"id": "j9-7", "t": "out", "q": "Што ќе испечати?", "code": "console.log([10, 20, 30, 40].slice(-3), [10].slice(-3));", "lang": "js", "run": true, "a": 3, "o": ["[20, 30, 40] []", "[40] [10]", "[10, 20, 30] [10]", "[20, 30, 40] [10]"], "e": "<code>slice(-3)<\/code> ги зема последните 3 (или сите ако има помалку). Така monitor-от ги чува последните <code>limit<\/code> температури."}, {"id": "j9-8", "t": "out", "q": "Што ќе испечати?", "code": "function createMonitor(limit) {\n  let temps = [];\n  let total = 0;\n  return t => {\n    temps = [...temps, t].slice(-limit);\n    total++;\n    return { last: [...temps], total };\n  };\n}\nconst m = createMonitor(2);\nm(1); m(2);\nconst r = m(3);\nr.last.push(99);\nconsole.log(m(4));", "lang": "js", "run": true, "a": 1, "o": ["{last: [99, 4], total: 4}", "{last: [3, 4], total: 4}", "{last: [3, 4], total: 2}", "{last: [3, 99, 4], total: 4}"], "e": "<strong>Closure<\/strong> ги чува <code>temps<\/code> и <code>total<\/code> меѓу повиците. Се враќа <strong>копија<\/strong> <code>[...temps]<\/code>, па <code>push(99)<\/code> не ја менува внатрешната состојба. <code>total<\/code> никогаш не се крати."}, {"id": "j9-9", "t": "out", "q": "Што ќе испечати?", "code": "const a = createMonitor(3);\nconst b = createMonitor(3);\na(10); a(20);\nconsole.log(b(5));\nfunction createMonitor(limit) {\n  let temps = [];\n  let total = 0;\n  return t => { temps = [...temps, t].slice(-limit); total++; return { temps: [...temps], total }; };\n}", "lang": "js", "run": true, "a": 2, "o": ["{temps: [10, 20, 5], total: 3}", "ReferenceError: Cannot access 'createMonitor' before initialization", "{temps: [5], total: 1}", "{temps: [20, 5], total: 3}"], "e": "Секој повик на <code>createMonitor<\/code> прави <strong>нови<\/strong> променливи, па <code>a<\/code> и <code>b<\/code> се независни. (И да, function declaration е hoisted, па може да се повика пред дефиницијата.)"}, {"id": "j9-10", "t": "out", "q": "Што ќе испечати?", "code": "const periods = [\"Ноќ\", \"Утро\", \"Попладне\", \"Вечер\"];\nconst hour = Number(\"2025-06-15T14:00\".slice(11, 13));\nconsole.log(hour, periods[Math.floor(hour / 6)], periods[Math.floor(5 / 6)]);", "lang": "js", "run": true, "a": 2, "o": ["14 Вечер Утро", "14 Утро Ноќ", "14 Попладне Ноќ", "2 Утро Ноќ"], "e": "<code>slice(11, 13)<\/code> го вади <code>\"14\"<\/code>, <code>Number<\/code> → <code>14<\/code>. <code>Math.floor(14 / 6) = 2<\/code> → Попладне. <code>Math.floor(5 / 6) = 0<\/code> → Ноќ."}, {"id": "j9-11", "t": "out", "q": "Што ќе испечати?", "code": "const average = v => v.reduce((s, x) => s + x, 0) / v.length;\nconsole.log(average([2, 4]), average([]));", "lang": "js", "run": true, "a": 3, "o": ["3 undefined", "3 Infinity", "3 0", "3 NaN"], "e": "За празна низа: <code>0 / 0<\/code> е <code>NaN<\/code>. Затоа празните групи се филтрираат <strong>пред<\/strong> просекот."}, {"id": "j9-12", "t": "out", "q": "Што ќе испечати?", "code": "const cities = [\n  { records: [{ rain: 0 }, { rain: 0.2 }] },\n  { records: [{ rain: 0.1 }, { rain: 0.3 }] }\n];\nconsole.log(\n  cities.every(c => c.records.some(r => r.rain === 0)),\n  cities.some(c => c.records.every(r => r.rain > 0))\n);", "lang": "js", "run": true, "a": 2, "o": ["true true", "true false", "false true", "false false"], "e": "Вториот град нема час со <code>rain === 0<\/code>, па <code>every(...)<\/code> е <code>false<\/code>. Вториот град има дожд во сите часови, па <code>some(... every ...)<\/code> е <code>true<\/code>."}, {"id": "j9-13", "t": "out", "q": "Што ќе испечати?", "code": "console.log(Math.max(...[4, 7, 1]), Math.max(), 0.1 + 0.2);", "lang": "js", "run": true, "a": 1, "o": ["7 undefined 0.3", "7 -Infinity 0.30000000000000004", "7 0 0.3", "[4, 7, 1] -Infinity 0.3"], "e": "Spread ја растура низата. <code>Math.max()<\/code> без аргументи е <code>-Infinity<\/code>. <code>0.1 + 0.2<\/code> е класичен floating point резултат (затоа тестовите заокружуваат)."}, {"id": "j9-14", "t": "mcq", "q": "Во Zadaca 2, зошто филтерот е <code>record.rain !== null<\/code> наместо само <code>record.rain<\/code> (truthy проверка)?", "code": null, "lang": "js", "run": false, "a": 0, "o": ["Затоа што <code>0<\/code> (без врнежи) е <strong>валидна<\/strong> вредност, а е falsy, па truthy проверка погрешно би ја отфрлила", "Затоа што <code>!==<\/code> е побрзо", "Нема разлика", "Затоа што <code>null<\/code> е truthy"], "e": "Ова е честа грешка: <code>0<\/code>, <code>\"\"<\/code> и <code>NaN<\/code> се falsy. Кога сакаш да отфрлиш само <code>null<\/code>, проверувај експлицитно."}, {"id": "j9-15", "t": "mcq", "q": "Во Zadaca 1, што значи барањето „промена на рејтингот без нови HTTP барања“ за структурата на кодот?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["Се користи <code>localStorage<\/code>", "Секоја промена повторно повикува <code>fetch<\/code>", "Се користи <code>setInterval<\/code>", "Податоците се чуваат во <strong>глобална променлива<\/strong> (<code>let shows = []<\/code>); <code>onchange<\/code> го вика само <code>displaySeries()<\/code>"], "e": "Вчитувањето (fetch → merge → store) е еднаш. Прикажувањето (filter → group → draw → report) е при секоја промена, од зачуваните податоци."}]}, {"id": "v1", "part": "vue", "title": "Што е Vue и како работи", "lesson": "<h3>Vue во една реченица<\/h3>\n<p><strong>Vue.js<\/strong> е <strong>прогресивен JavaScript framework<\/strong> за градење кориснички интерфејси. Ти кажуваш <strong>како треба да изгледа UI за дадена состојба (податоци)<\/strong>, а Vue сам го менува DOM-от кога податоците се менуваат.<\/p>\n<div class=\"tip\">Аналогија: без Vue, ти си келнер што рачно го пишува секое ново мени на таблата (DOM манипулација). Со Vue, само го менуваш списокот јадења во тетратката (state), а таблата сама се ажурира.<\/div>\n<h3>Императивно vs декларативно<\/h3>\n<p><strong>Императивно<\/strong> (рачно, како во JS лекциите): „најди го елементот, смени му го текстот“.<\/p>\n<pre class=\"code\" data-lang=\"js\"><code>let count = 0;\nbtn.addEventListener(\"click\", () =&gt; {\n  count++;\n  document.querySelector(\"#out\").textContent = count;  // рачно синхронизирање\n});<\/code><\/pre>\n<p><strong>Декларативно<\/strong> (Vue): опиши го резултатот, Vue го одржува синхронизиран.<\/p>\n<pre class=\"code\" data-lang=\"html\"><code>&lt;button @click=\"count++\"&gt;{{ count }}&lt;/button&gt;<\/code><\/pre>\n<h3>„Прогресивен“<\/h3>\n<p>Можеш да го користиш <strong>малку<\/strong> (само на еден дел од HTML страна, преку <code>&lt;script&gt;<\/code>) или <strong>целосно<\/strong> (цела SPA апликација со router, store, build алатки). Поддржува SFC, JS, TypeScript и JSX.<\/p>\n<h3>Историја<\/h3>\n<ul><li><strong>Vue 1<\/strong>: едноставни реактивни views.<\/li><li><strong>Vue 2<\/strong>: зрели компоненти и екосистем.<\/li><li><strong>Vue 3<\/strong>: <strong>Proxy-based реактивност<\/strong>, <strong>Composition API<\/strong>, подобар TypeScript. (Ноември 2026: 3.5 stable.)<\/li><li>Официјален екосистем: <strong>Vue Router<\/strong> (рутирање) и <strong>Pinia<\/strong> (state store).<\/li><\/ul>\n<h3>Типови апликации<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>Тип<\/th><th>Што значи<\/th><\/tr><\/thead><tbody><tr><td><strong>MPA<\/strong> (Multi Page)<\/td><td>серверот враќа нов HTML за секоја навигација<\/td><\/tr><tr><td><strong>SPA<\/strong> (Single Page)<\/td><td>една страна, client-side routing ја менува содржината без reload<\/td><\/tr><tr><td><strong>SSR<\/strong> (Server Side Rendering)<\/td><td>HTML се рендерира на сервер, па се „hydrate“ во browser<\/td><\/tr><tr><td><strong>SSG<\/strong> (Static Site Generation)<\/td><td>страните се pre-render при build<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Наједноставна Vue апликација<\/h3>\n<pre class=\"code\" data-lang=\"html\"><code>&lt;div id=\"app\"&gt;\n  &lt;button @click=\"count++\"&gt;{{ count }}&lt;/button&gt;\n&lt;/div&gt;\n&lt;script type=\"module\"&gt;\n  import { createApp, ref } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'\n  createApp({\n    setup() { return { count: ref(0) } }\n  }).mount('#app')\n&lt;/script&gt;<\/code><\/pre>\n<ul><li><code>createApp(...)<\/code> ја прави апликацијата, <code>.mount('#app')<\/code> ја закачува на елементот.<\/li><li><code>ref(0)<\/code> прави <strong>реактивна<\/strong> состојба.<\/li><li>Кликот ја менува состојбата, <strong>view-то реагира автоматски<\/strong>.<\/li><\/ul>\n<h3>Споредба со други frameworks<\/h3>\n<div class=\"tbl\"><table><thead><tr><th><\/th><th>Пишување UI<\/th><th>Реактивност<\/th><\/tr><\/thead><tbody><tr><td><strong>Vue<\/strong><\/td><td>HTML-like templates (или JSX)<\/td><td>refs, proxies, computed, effects<\/td><\/tr><tr><td><strong>React<\/strong><\/td><td>JSX (function components)<\/td><td>hooks/state → re-render<\/td><\/tr><tr><td><strong>Angular<\/strong><\/td><td>templates + TypeScript<\/td><td>signals + change detection, RxJS<\/td><\/tr><tr><td><strong>Svelte<\/strong><\/td><td>компајлирани templates (runes)<\/td><td>компајлерот ги генерира зависностите<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Vue и React користат <strong>Virtual DOM<\/strong>. Изборот на framework е <strong>инженерски компромис<\/strong> (тим, постоечки код), не натпревар во популарност. Microbenchmarks не се универзални рангирања.<\/p>\n<h3>Архитектура (одгоре надолу)<\/h3>\n<ol><li><strong>Application / Components<\/strong><\/li><li><strong>Template Compiler<\/strong>: templates → <strong>render функции<\/strong><\/li><li><strong>Reactivity<\/strong>: <code>ref<\/code> / <code>reactive<\/code> / effects, следи читања и пишувања<\/li><li><strong>Runtime Core + Scheduler + VDOM<\/strong><\/li><li><strong>Browser DOM Renderer<\/strong><\/li><\/ol>\n<h3>Virtual DOM<\/h3>\n<ul><li>Render функцијата прави <strong>VNodes<\/strong> (виртуелни јазли, обични JS објекти).<\/li><li>При промена, Vue прави ново VNode дрво и го <strong>споредува (patching / reconciling)<\/strong> со старото, па во вистинскиот DOM ги менува <strong>само разликите<\/strong>.<\/li><li>Virtual DOM е <strong>стратегија на имплементација<\/strong>, <strong>не<\/strong> е посебен DOM во browser-от.<\/li><\/ul>\n<h3>Rendering pipeline<\/h3>\n<ol><li>Template → render функција (за SFC: при <strong>build<\/strong>).<\/li><li>Се креира компонента и <strong>render effect<\/strong>.<\/li><li><strong>Mount<\/strong>: се прават првите DOM јазли.<\/li><li>Се следат зависности; промена → <strong>scheduler<\/strong> (batched) → <strong>patch<\/strong> на DOM.<\/li><\/ol>", "qs": [{"id": "v1-1", "t": "mcq", "q": "Што значи Vue да е <strong>декларативен<\/strong>?", "code": null, "lang": "js", "run": false, "a": 0, "o": ["Опишуваш како UI треба да изгледа за дадена состојба, а Vue го одржува DOM-от синхронизиран", "Секоја компонента мора да е декларирана во <code>index.html<\/code>", "Работи само на сервер", "Мора рачно да го менуваш DOM-от со <code>querySelector<\/code>"], "e": "Императивно = ти ги кажуваш чекорите (најди, смени). Декларативно = опишуваш резултат, framework-от се грижи за чекорите."}, {"id": "v1-2", "t": "mcq", "q": "Зошто Vue се вика <strong>прогресивен<\/strong> framework?", "code": null, "lang": "js", "run": false, "a": 0, "o": ["Може постепено да се усвои: од мал дел на една HTML страна до цела SPA", "Секоја верзија е побрза од претходната", "Има прогрес бар компонента", "Работи само со TypeScript"], "e": "Incremental adoption: не мора да ја препишеш целата апликација, можеш да почнеш со една компонента."}, {"id": "v1-3", "t": "mcq", "q": "Кој тип апликација има <strong>една страна<\/strong> каде client-side routing ја менува содржината без reload?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["MPA", "SSG", "SSR", "SPA"], "e": "SPA = Single Page Application. MPA враќа нов HTML од сервер секој пат; SSR рендерира на сервер и прави hydration; SSG pre-render при build."}, {"id": "v1-4", "t": "mcq", "q": "Што е <strong>SSR<\/strong>?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["Страните се генерираат еднаш при build", "Само CSS се рендерира на сервер", "Друго име за SPA", "HTML се рендерира на сервер, па во browser се „hydrate“ (оживува со JS)"], "e": "Server Side Rendering. Корисно за брз прв приказ и SEO. SSG е кога страните се pre-render при build."}, {"id": "v1-5", "t": "mcq", "q": "Што е новото во <strong>Vue 3<\/strong> според лекцијата?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Отстранет е Virtual DOM", "Само Options API", "Proxy-based реактивност, Composition API и подобар TypeScript", "Прв пат компоненти"], "e": "Vue 1: реактивни views. Vue 2: зрели компоненти. Vue 3: Proxy реактивност + Composition API + TS."}, {"id": "v1-6", "t": "mcq", "q": "Што е точно за <strong>Virtual DOM<\/strong>?", "code": null, "lang": "js", "run": false, "a": 0, "o": ["Render функцијата прави VNodes (JS објекти); Vue ги споредува со претходните и го patch-ира вистинскиот DOM само таму каде има разлика", "Тоа е CSS техника", "Vue 3 не го користи", "Тоа е втор DOM што browser-от го чува"], "e": "VDOM е <strong>стратегија на имплементација<\/strong>, не посебен browser DOM. Компајлерот додава hints за да прескокне непотребна работа."}, {"id": "v1-7", "t": "mcq", "q": "Што прави <strong>Template Compiler<\/strong>-от во архитектурата на Vue?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Ги минифицира CSS фајловите", "Ги претвора templates во <strong>render функции<\/strong>", "Го компајлира JS во WebAssembly", "Прави HTTP барања"], "e": "Template → render функција → VNodes → patch на DOM. За SFC ова се случува при build."}, {"id": "v1-8", "t": "mcq", "q": "Кој е правилниот редослед во <strong>rendering pipeline<\/strong>?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["Patch → mount → compile", "Mount DOM → compile template → patch → track", "Fetch податоци → compile → mount", "Compile template → креирај компонента и render effect → mount DOM → track зависности, schedule, patch"], "e": "Промените во state одат во <strong>scheduler<\/strong> (batched), па се прави VNode patch во browser DOM."}, {"id": "v1-9", "t": "mcq", "q": "Која комбинација е <strong>точна<\/strong> за пишување UI?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Vue: само JSX; React: HTML templates", "Vue: HTML-like templates (или JSX); React: JSX; Svelte: компајлирани templates", "Angular: JSX; Svelte: Virtual DOM", "Сите користат исто"], "e": "Vue и React користат Virtual DOM; Svelte компајлира ажурирања од декларациите; Angular користи framework-managed ажурирања."}]}, {"id": "v2", "part": "vue", "title": "Проект, SFC и setup", "lesson": "<h3>Single-File Components (SFC)<\/h3>\n<p>Фајл <code>.vue<\/code> ги групира <strong>трите дела<\/strong> на една компонента:<\/p>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;script setup&gt;\nimport { ref } from 'vue'\nconst title = ref('Hello Vue!')\n&lt;/script&gt;\n\n&lt;template&gt;\n  &lt;h1&gt;{{ title }}&lt;/h1&gt;\n&lt;/template&gt;\n\n&lt;style scoped&gt;\nh1 { color: #42b883; }\n&lt;/style&gt;<\/code><\/pre>\n<ul><li><code>&lt;script setup&gt;<\/code>: сè што е декларирано на <strong>top-level<\/strong> (променливи, функции, imports) е <strong>автоматски достапно<\/strong> во template-от. Нема потреба од <code>return<\/code>.<\/li><li><code>&lt;template&gt;<\/code>: HTML-like шаблон.<\/li><li><code>&lt;style scoped&gt;<\/code>: CSS што важи <strong>само за оваа компонента<\/strong> (Vue додава уникатни атрибути на селекторите).<\/li><li>SFC се компајлираат со <strong>Vite<\/strong> и <code>@vue/compiler-sfc<\/code>.<\/li><\/ul>\n<h3>Креирање проект<\/h3>\n<pre class=\"code\" data-lang=\"bash\"><code>npm create vue@latest   # официјален wizard (create-vue)\ncd my-vue-app\nnpm install             # инсталирај зависности\nnpm run dev             # dev сервер (со HMR)\nnpm run build           # production build во dist/<\/code><\/pre>\n<p>Wizard-от нуди опции: TypeScript, Router, Pinia, Vitest, ESLint. Алатки: Node.js, npm/pnpm/yarn, VS Code + <strong>Vue - Official<\/strong> extension, <strong>Vue DevTools<\/strong>.<\/p>\n<h3>Структура на Vite проект<\/h3>\n<ul><li><code>index.html<\/code>: го содржи елементот за mount (<code>&lt;div id=\"app\"&gt;<\/code>).<\/li><li><code>src/main.js<\/code>: ја креира апликацијата и го mount-ира <code>App.vue<\/code>.<\/li><li><code>App.vue<\/code>: <strong>root<\/strong> компонента.<\/li><li><code>components/<\/code>: компоненти за повеќекратна употреба.<\/li><li>Подоцна: <code>views/<\/code>, <code>router/<\/code>, <code>stores/<\/code>, <code>composables/<\/code>, <code>services/<\/code>.<\/li><li><code>package.json<\/code>: скрипти и зависности. <code>vite.config.js<\/code>: plugins и опции.<\/li><\/ul>\n<h3>Entry point<\/h3>\n<pre class=\"code\" data-lang=\"js\"><code>import { createApp } from 'vue'\nimport { createPinia } from 'pinia'\nimport router from './router'\nimport App from './App.vue'\n\ncreateApp(App)          // креирај апликација\n  .use(createPinia())   // plugin: state store\n  .use(router)          // plugin: router\n  .mount('#app')        // закачи на DOM<\/code><\/pre>\n<h3>Dev vs Production<\/h3>\n<ul><li>Во development, Vite служи <strong>ES modules<\/strong> директно; <strong>HMR<\/strong> (Hot Module Replacement) ги ажурира само изменетите модули без reload.<\/li><li><code>npm run build<\/code> прави оптимизирани фајлови во <strong><code>dist/<\/code><\/strong>. За SPA на сервер треба <strong>fallback<\/strong> рута (сите патеки → <code>index.html<\/code>).<\/li><\/ul>", "qs": [{"id": "v2-1", "t": "mcq", "q": "Кои три дела ги групира еден <code>.vue<\/code> (SFC) фајл?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["<code>&lt;head&gt;<\/code>, <code>&lt;body&gt;<\/code>, <code>&lt;footer&gt;<\/code>", "<code>&lt;script&gt;<\/code>, <code>&lt;template&gt;<\/code>, <code>&lt;style&gt;<\/code>", "<code>&lt;data&gt;<\/code>, <code>&lt;methods&gt;<\/code>, <code>&lt;computed&gt;<\/code>", "<code>&lt;html&gt;<\/code>, <code>&lt;js&gt;<\/code>, <code>&lt;css&gt;<\/code>"], "e": "Single-File Component = логика + шаблон + стилови на едно место."}, {"id": "v2-2", "t": "mcq", "q": "Што е посебно кај <code>&lt;script setup&gt;<\/code>?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["Не смее да има imports", "Се извршува само на сервер", "Мора да заврши со <code>return { ... }<\/code>", "Top-level променливите, функциите и imports се <strong>автоматски достапни<\/strong> во template-от"], "e": "Со обично <code>setup()<\/code> мораш да вратиш објект. Со <code>&lt;script setup&gt;<\/code> сè на top-level е изложено на template-от."}, {"id": "v2-3", "t": "mcq", "q": "Што прави <code>&lt;style scoped&gt;<\/code>?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["Стиловите важат глобално за целата апликација", "Ги вчитува стиловите асинхроно", "Го исклучува CSS-от во production", "CSS-от важи <strong>само за таа компонента<\/strong>"], "e": "Vue ги генерира селекторите со уникатни атрибути, па нема „протекување“ во други компоненти."}, {"id": "v2-4", "t": "mcq", "q": "Која команда го стартува <strong>официјалниот wizard<\/strong> за нов Vue проект?", "code": null, "lang": "js", "run": false, "a": 0, "o": ["<code>npm create vue@latest<\/code>", "<code>npm run build<\/code>", "<code>vue start<\/code>", "<code>npm install vue<\/code>"], "e": "<code>create-vue<\/code> поставува Vite + Vue и прашува за TS, Router, Pinia, Vitest, ESLint. Потоа <code>npm install<\/code> и <code>npm run dev<\/code>."}, {"id": "v2-5", "t": "mcq", "q": "Што прави <code>npm run build<\/code>?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Ги брише node_modules", "Прави production фајлови (во <code>dist/<\/code>) за deploy", "Ги инсталира зависностите", "Го стартува dev серверот"], "e": "<code>npm run dev<\/code> = развој со HMR. <code>npm run build<\/code> = оптимизиран output за deploy."}, {"id": "v2-6", "t": "mcq", "q": "Во <code>createApp(App).use(router).mount('#app')<\/code>, што прави <code>.use(router)<\/code>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Го стартува серверот", "Ја прави компонентата <code>App<\/code>", "Додава <strong>plugin<\/strong> (тука router) во апликацијата", "Го закачува на DOM"], "e": "<code>createApp<\/code> = инстанца, <code>.use(...)<\/code> = plugins (router, pinia), <code>.mount('#app')<\/code> = закачување на DOM елементот."}, {"id": "v2-7", "t": "mcq", "q": "Што е <strong>HMR<\/strong>?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Vue DevTools функција за memory", "Hot Module Replacement: само изменетиот модул се ажурира во browser-от без целосен reload", "Начин за SSR", "HTML Markup Renderer"], "e": "Vite служи ES modules во development и со HMR веднаш ги гледаш промените."}, {"id": "v2-8", "t": "mcq", "q": "Кој фајл е <strong>root компонента<\/strong> во типичен Vue проект?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["<code>index.html<\/code>", "<code>main.js<\/code>", "<code>vite.config.js<\/code>", "<code>App.vue<\/code>"], "e": "<code>index.html<\/code> има mount елемент, <code>main.js<\/code> ја креира апликацијата и го mount-ира <code>App.vue<\/code>, кој е коренот на дрвото компоненти."}]}, {"id": "v3", "part": "vue", "title": "Template синтакса, bindings и events", "lesson": "<h3>Text interpolation <code>{{ }}<\/code><\/h3>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;script setup&gt;\nimport { ref } from 'vue'\nconst name = ref('Ada')\nconst score = ref(8)\n&lt;/script&gt;\n\n&lt;template&gt;\n  &lt;h2&gt;Hello, {{ name.toUpperCase() }}&lt;/h2&gt;   &lt;!-- Hello, ADA --&gt;\n  &lt;p&gt;Score doubled: {{ score * 2 }}&lt;/p&gt;       &lt;!-- 16 --&gt;\n&lt;/template&gt;<\/code><\/pre>\n<ul><li>Во <code>{{ }}<\/code> може <strong>JS израз<\/strong> (не наредби како <code>if<\/code>/<code>for<\/code>).<\/li><li><strong>Избегнувај side effects<\/strong> во template изрази.<\/li><li>Interpolation го <strong>escape-ира<\/strong> содржината (HTML се прикажува како текст, безбедно).<\/li><li>Во template <strong>не пишуваш <code>.value<\/code><\/strong>: Vue автоматски ги „одвиткува“ refs.<\/li><\/ul>\n<h3>Attribute binding: <code>v-bind<\/code> / <code>:<\/code><\/h3>\n<p><code>{{ }}<\/code> не работи во атрибути! За динамичен атрибут:<\/p>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;a v-bind:href=\"url\"&gt;Docs&lt;/a&gt;\n&lt;a :href=\"url\"&gt;Docs&lt;/a&gt;            &lt;!-- кратенка, исто --&gt;\n&lt;button :disabled=\"!name\"&gt;Save&lt;/button&gt;\n&lt;UserCard :age=\"24\" /&gt;              &lt;!-- : = JS израз (број 24) --&gt;\n&lt;UserCard age=\"24\" /&gt;               &lt;!-- без : = string \"24\" --&gt;<\/code><\/pre>\n<h3>Class и style bindings<\/h3>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;p :class=\"{ active: isActive, error: hasError }\"&gt;...&lt;/p&gt;\n&lt;p class=\"card\" :class=\"{ active }\"&gt;...&lt;/p&gt;   &lt;!-- статична + динамична --&gt;\n&lt;p :class=\"['big', isActive ? 'on' : 'off']\"&gt;...&lt;/p&gt;\n&lt;p :style=\"{ fontSize: active ? '28px' : '16px' }\"&gt;Preview&lt;/p&gt;<\/code><\/pre>\n<p>Објект: клучот е име на класа, вредноста е услов. <code>{ active }<\/code> е кратко за <code>{ active: active }<\/code>.<\/p>\n<h3>Event handling: <code>v-on<\/code> / <code>@<\/code><\/h3>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;script setup&gt;\nimport { ref } from 'vue'\nconst count = ref(0)\nfunction increment() { count.value++ }   // во script: .value!\n&lt;/script&gt;\n&lt;template&gt;\n  &lt;button v-on:click=\"increment\"&gt;{{ count }}&lt;/button&gt;\n  &lt;button @click=\"increment\"&gt;{{ count }}&lt;/button&gt;   &lt;!-- кратенка --&gt;\n  &lt;button @click=\"count++\"&gt;inline израз&lt;/button&gt;     &lt;!-- во template: без .value --&gt;\n&lt;/template&gt;<\/code><\/pre>\n<p>Handler може да е <strong>име на функција<\/strong> или <strong>inline израз<\/strong>. Event објектот во inline е <code>$event<\/code>.<\/p>\n<h3>Модификатори<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>Модификатор<\/th><th>Што прави<\/th><th>Еквивалент во JS<\/th><\/tr><\/thead><tbody><tr><td><code>@submit.prevent<\/code><\/td><td>не ја праќа формата (без reload)<\/td><td><code>evt.preventDefault()<\/code><\/td><\/tr><tr><td><code>@click.stop<\/code><\/td><td>не бубли нагоре<\/td><td><code>evt.stopPropagation()<\/code><\/td><\/tr><tr><td><code>@click.once<\/code><\/td><td>само првиот клик<\/td><td><code>{ once: true }<\/code><\/td><\/tr><tr><td><code>@click.self<\/code><\/td><td>само ако кликнеш точно на тој елемент (не на дете)<\/td><td><code>evt.target === evt.currentTarget<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;form @submit.prevent=\"save\"&gt;\n  &lt;input v-model=\"message\" /&gt;\n  &lt;button type=\"submit\"&gt;Save&lt;/button&gt;\n&lt;/form&gt;\n&lt;button @click.once=\"message = 'Clicked once'\"&gt;Once&lt;/button&gt;<\/code><\/pre>", "qs": [{"id": "v3-1", "t": "mcq", "q": "Ако <code>name<\/code> е <code>ref('Ada')<\/code>, што прикажува <code>&lt;h2&gt;Hello, {{ name.toUpperCase() }}&lt;/h2&gt;<\/code>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Грешка: треба <code>name.value.toUpperCase()<\/code>", "Hello, Ada", "Hello, ADA", "Hello, {{ name.toUpperCase() }}"], "e": "Во <code>{{ }}<\/code> може JS израз, и во template refs се <strong>автоматски одвиткани<\/strong> (не пишуваш <code>.value<\/code>)."}, {"id": "v3-2", "t": "mcq", "q": "Што е кратенка за <code>v-bind:href=\"url\"<\/code>?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["<code>#href=\"url\"<\/code>", "<code>{{ href }}=\"url\"<\/code>", "<code>@href=\"url\"<\/code>", "<code>:href=\"url\"<\/code>"], "e": "<code>v-bind:<\/code> → <code>:<\/code>. <code>v-on:<\/code> → <code>@<\/code>. <code>v-slot:<\/code> → <code>#<\/code>."}, {"id": "v3-3", "t": "mcq", "q": "Која е разликата меѓу <code>&lt;UserCard age=\"24\" /&gt;<\/code> и <code>&lt;UserCard :age=\"24\" /&gt;<\/code>?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Со <code>:<\/code> е two-way binding", "Без <code>:<\/code> се праќа string <code>\"24\"<\/code>; со <code>:<\/code> се евалуира JS израз, па се праќа <strong>број<\/strong> <code>24<\/code>", "Нема разлика", "Без <code>:<\/code> не работи"], "e": "<code>:<\/code> (v-bind) значи „вредноста е JS израз“. Без него, атрибутот е буквален string."}, {"id": "v3-4", "t": "mcq", "q": "Зошто <code>&lt;a href=\"{{ url }}\"&gt;<\/code> <strong>не работи<\/strong> во Vue?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Треба <code>{{{ url }}}<\/code>", "Работи, нема проблем", "Interpolation <code>{{ }}<\/code> работи само во текст; за атрибути се користи <code>:href=\"url\"<\/code>", "<code>href<\/code> не може да е динамичен"], "e": "Атрибутите се врзуваат со <code>v-bind<\/code> / <code>:<\/code>."}, {"id": "v3-5", "t": "mcq", "q": "Што прави <code>&lt;p :class=\"{ active: isActive }\"&gt;<\/code>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Го поставува <code>active<\/code> атрибут на <code>isActive<\/code>", "Ја брише класата <code>active<\/code>", "Ја додава класата <code>active<\/code> само кога <code>isActive<\/code> е truthy", "Секогаш ја додава класата <code>isActive<\/code>"], "e": "Class објект: клучот е име на класа, вредноста е услов. Може да се комбинира со статичен <code>class=\"...\"<\/code>."}, {"id": "v3-6", "t": "mcq", "q": "Што е кратенка за <code>v-on:click=\"save\"<\/code>?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["<code>#click=\"save\"<\/code>", "<code>@click=\"save\"<\/code>", "<code>on-click=\"save\"<\/code>", "<code>:click=\"save\"<\/code>"], "e": "<code>v-on<\/code> → <code>@<\/code>. Handler може да е функција или inline израз."}, {"id": "v3-7", "t": "mcq", "q": "Што прави <code>&lt;form @submit.prevent=\"save\"&gt;<\/code>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Го запира bubbling на настанот", "Го праќа формата двапати", "Го вика <code>save<\/code> и ја спречува default акцијата (праќање на формата и reload на страната)", "Го спречува <code>save<\/code> да се извика"], "e": "<code>.prevent<\/code> = <code>event.preventDefault()<\/code>. За bubbling е <code>.stop<\/code>."}, {"id": "v3-8", "t": "mcq", "q": "Колку пати ќе се изврши handler-от на <code>&lt;button @click.once=\"n++\"&gt;<\/code> ако кликнеш 5 пати?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["2", "0", "1", "5"], "e": "<code>.once<\/code> го слуша само првиот настан, исто како <code>{ once: true }<\/code> во <code>addEventListener<\/code>."}, {"id": "v3-9", "t": "mcq", "q": "Во <code>&lt;script setup&gt;<\/code>, <code>const count = ref(0)<\/code>. Кој код е <strong>точен<\/strong>?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["И двете: <code>count++<\/code>", "И двете: <code>count.value++<\/code>", "Во script: <code>count++<\/code>; во template: <code>count.value++<\/code>", "Во script: <code>count.value++<\/code>; во template: <code>count++<\/code>"], "e": "Во JavaScript мора <code>.value<\/code>. Во template Vue автоматски го одвиткува ref-от."}, {"id": "v3-10", "t": "mcq", "q": "Каде се прикажува modal ако на overlay има <code>@click.self=\"open = false\"<\/code>, а кликнеш <strong>на содржината на modal-от<\/strong> (дете на overlay)?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Се затвора и пак се отвора", "Грешка", "Modal-от останува отворен, <code>.self<\/code> реагира само кога target е самиот overlay", "Modal-от се затвора"], "e": "<code>.self<\/code> = само ако <code>event.target<\/code> е елементот на кој е handler-от. Клик на дете не го активира."}]}, {"id": "v4", "part": "vue", "title": "Услови, листи и v-model", "lesson": "<h3><code>v-if<\/code> / <code>v-else-if<\/code> / <code>v-else<\/code><\/h3>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;p v-if=\"loading\"&gt;Loading...&lt;/p&gt;\n&lt;p v-else-if=\"error\"&gt;{{ error }}&lt;/p&gt;\n&lt;p v-else&gt;Ready!&lt;/p&gt;<\/code><\/pre>\n<p><code>v-if<\/code> <strong>креира или отстранува<\/strong> цел subtree од DOM-от. <code>v-else<\/code> мора веднаш после <code>v-if<\/code>/<code>v-else-if<\/code>.<\/p>\n<h3><code>v-show<\/code><\/h3>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;p v-show=\"expanded\"&gt;Details&lt;/p&gt;<\/code><\/pre>\n<p><code>v-show<\/code> <strong>секогаш го рендерира<\/strong> елементот и само го менува CSS <strong><code>display<\/code><\/strong> (<code>none<\/code>). Елементот останува mount-иран во DOM.<\/p>\n<div class=\"tip\"><code>v-if<\/code> = „дали воопшто да постои“ (поскапо за често менување, но не чини ништо кога е false). <code>v-show<\/code> = „дали да се гледа“ (подобро за често toggle).<\/div>\n<h3><code>v-for<\/code> и <code>:key<\/code><\/h3>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;ul&gt;\n  &lt;li v-for=\"item in items\" :key=\"item.id\"&gt;{{ item.title }}&lt;/li&gt;\n&lt;/ul&gt;<\/code><\/pre>\n<ul><li>Јамка низ <strong>низи и објекти<\/strong>.<\/li><li><strong>Секогаш стабилен <code>:key<\/code><\/strong> (уникатен id), за Vue ефикасно да прави diff и да го чува идентитетот на редовите (особено ако имаат состојба, пр. input).<\/li><li>Индекс како key е лоша идеја кога листата се менува.<\/li><li>За <strong>филтрирана<\/strong> листа користи <code>computed()<\/code> (не <code>v-if<\/code> во <code>v-for<\/code>).<\/li><\/ul>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;script setup&gt;\nimport { ref, computed } from 'vue'\nconst search = ref('')\nconst items = ref([{ id: 1, name: 'Laptop' }, { id: 2, name: 'Phone' }])\nconst visible = computed(() =&gt;\n  items.value.filter(x =&gt; x.name.toLowerCase().includes(search.value.toLowerCase())))\n&lt;/script&gt;\n&lt;template&gt;\n  &lt;input v-model=\"search\" placeholder=\"Find a product\" /&gt;\n  &lt;ul&gt;&lt;li v-for=\"item in visible\" :key=\"item.id\"&gt;{{ item.name }}&lt;/li&gt;&lt;/ul&gt;\n  &lt;p v-if=\"!visible.length\"&gt;No matches&lt;/p&gt;\n&lt;/template&gt;<\/code><\/pre>\n<h3><code>v-model<\/code>: two-way binding<\/h3>\n<p><code>v-model<\/code> ги <strong>синхронизира<\/strong> state и form control-а во двете насоки: куцаш → state се менува; state се менува → полето се ажурира.<\/p>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;script setup&gt;\nimport { ref } from 'vue'\nconst name = ref('')\nconst language = ref('JavaScript')\nconst agree = ref(false)\n&lt;/script&gt;\n&lt;template&gt;\n  &lt;input v-model.trim=\"name\" /&gt;\n  &lt;select v-model=\"language\"&gt;\n    &lt;option&gt;JavaScript&lt;/option&gt;&lt;option&gt;TypeScript&lt;/option&gt;\n  &lt;/select&gt;\n  &lt;label&gt;&lt;input type=\"checkbox\" v-model=\"agree\" /&gt; Accept&lt;/label&gt;\n  &lt;button :disabled=\"!name || !agree\"&gt;Register&lt;/button&gt;\n&lt;/template&gt;<\/code><\/pre>\n<ul><li>Работи со <code>input<\/code>, <code>textarea<\/code>, <code>select<\/code>, checkbox, radio.<\/li><li>Checkbox → <code>true<\/code>/<code>false<\/code>.<\/li><li>Модификатори: <strong><code>.trim<\/code><\/strong> (брише празни места), <strong><code>.number<\/code><\/strong> (претвора во број, инаку <code>input<\/code> секогаш дава <strong>string<\/strong>!), <code>.lazy<\/code> (на <code>change<\/code> наместо <code>input<\/code>).<\/li><li><code>v-model<\/code> е всушност <code>:value<\/code> + <code>@input<\/code> заедно.<\/li><\/ul>", "qs": [{"id": "v4-1", "t": "mcq", "q": "Која е главната разлика меѓу <code>v-if<\/code> и <code>v-show<\/code>?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["<code>v-show<\/code> го отстранува од DOM; <code>v-if<\/code> го крие со CSS", "<code>v-if<\/code> го креира/отстранува елементот од DOM; <code>v-show<\/code> секогаш го рендерира и само го менува CSS <code>display<\/code>", "<code>v-if<\/code> работи само со boolean", "Нема разлика"], "e": "Во DevTools: со <code>v-if=false<\/code> елементот не постои; со <code>v-show=false<\/code> постои со <code>display: none<\/code>."}, {"id": "v4-2", "t": "mcq", "q": "Панел се отвора/затвора многу често (пр. на секој hover). Што е подобро?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["<code>v-for<\/code>", "<code>v-show<\/code>", "<code>v-if<\/code>", "<code>v-model<\/code>"], "e": "<code>v-show<\/code> не прави mount/unmount секој пат, само менува <code>display<\/code>. <code>v-if<\/code> е подобар за услови што ретко се менуваат."}, {"id": "v4-3", "t": "mcq", "q": "<code>loading<\/code> е <code>false<\/code>, <code>error<\/code> е <code>\"404\"<\/code>. Што се прикажува?", "code": "<p v-if=\"loading\">Loading...<\/p>\n<p v-else-if=\"error\">{{ error }}<\/p>\n<p v-else>Ready!<\/p>", "lang": "vue", "run": false, "a": 0, "o": ["404", "Loading...", "404 и Ready!", "Ready!"], "e": "Синџирот прикажува <strong>само првиот<\/strong> вистинит услов. <code>loading<\/code> е false, <code>error<\/code> е truthy → <code>404<\/code>."}, {"id": "v4-4", "t": "mcq", "q": "Зошто <code>v-for<\/code> треба <strong>стабилен <code>:key<\/code><\/strong>?", "code": null, "lang": "js", "run": false, "a": 0, "o": ["За Vue ефикасно да ги спореди листите и да го зачува идентитетот на секој ред (и неговата состојба)", "За да се сортира листата", "Key е за CSS", "Без key, <code>v-for<\/code> не работи воопшто"], "e": "Со уникатен id Vue знае кој ред е кој, иако листата се менува. Без тоа може да се „мешаат“ состојби на редови."}, {"id": "v4-5", "t": "mcq", "q": "Кој е препорачаниот начин да прикажеш <strong>филтрирана<\/strong> листа?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["<code>v-if<\/code> во секој <code>v-for<\/code> елемент", "<code>watch<\/code> што брише елементи од оригиналната низа", "<code>computed()<\/code> што ја враќа филтрираната низа, па <code>v-for<\/code> над неа", "<code>v-show<\/code> на <code>&lt;ul&gt;<\/code>"], "e": "<code>computed<\/code> е кеширан и се пресметува само кога се менуваат зависностите (листата или search текстот)."}, {"id": "v4-6", "t": "mcq", "q": "Што прави <code>v-model<\/code>?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Само го чита полето еднаш", "Two-way binding: синхронизира state и form control во двете насоки", "Прави HTTP барање", "One-way binding од state кон view"], "e": "Куцаш → ref-от се менува. Ref-от се менува од код → полето се ажурира. Тоа е <code>:value<\/code> + <code>@input<\/code> заедно."}, {"id": "v4-7", "t": "mcq", "q": "<code>&lt;input type=\"number\" v-model=\"price\"&gt;<\/code>. Корисникот внесува 5. Каков тип е <code>price<\/code> без модификатор?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["undefined", "string <code>\"5\"<\/code>", "boolean", "number"], "e": "Input полињата даваат string (како <code>select.value<\/code> во Zadaca 1). Со <code>v-model.number<\/code> Vue го претвора во број."}, {"id": "v4-8", "t": "mcq", "q": "Што прави <code>v-model.trim=\"name\"<\/code>?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["Го брише полето по submit", "Го ограничува текстот на 10 знаци", "Го претвора во мали букви", "Ги брише празните места на почеток и крај"], "e": "Модификатори: <code>.trim<\/code> (празнини), <code>.number<\/code> (во број), <code>.lazy<\/code> (синхронизира на <code>change<\/code>)."}, {"id": "v4-9", "t": "mcq", "q": "Каква вредност дава <code>v-model<\/code> на <code>&lt;input type=\"checkbox\"&gt;<\/code>?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["текстот на label-от", "<code>1<\/code> / <code>0<\/code>", "<code>\"on\"<\/code> / <code>\"off\"<\/code>", "<code>true<\/code> / <code>false<\/code>"], "e": "Checkbox со <code>v-model<\/code> е boolean. Во примерот: <code>agree = ref(false)<\/code> и <code>:disabled=\"!name || !agree\"<\/code>."}, {"id": "v4-10", "t": "mcq", "q": "Во примерот, кога е копчето <code>Register<\/code> <strong>овозможено<\/strong>: <code>&lt;button :disabled=\"!name || !agree\"&gt;<\/code>?", "code": null, "lang": "js", "run": false, "a": 1, "o": ["Секогаш", "Кога <code>name<\/code> не е празно <strong>и<\/strong> <code>agree<\/code> е <code>true<\/code>", "Кога <code>agree<\/code> е <code>false<\/code>", "Кога <code>name<\/code> е празно"], "e": "<code>disabled<\/code> е true ако <code>!name<\/code> или <code>!agree<\/code>. Значи е овозможено само кога двете се исполнети."}]}, {"id": "v5", "part": "vue", "title": "Компоненти: props, emits, slots, v-model, provide", "lesson": "<h3>Зошто компоненти?<\/h3>\n<p>Сложен UI се дели на <strong>мали делови за повеќекратна употреба<\/strong>. Секоја компонента има свој markup и однесување, и тие се составуваат во <strong>дрво<\/strong>.<\/p>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;!-- App.vue --&gt;\n&lt;script setup&gt;\nimport UserCard from './components/UserCard.vue'   // PascalCase име на фајл\n&lt;/script&gt;\n&lt;template&gt;\n  &lt;UserCard name=\"Ada\" :age=\"24\" /&gt;\n&lt;/template&gt;<\/code><\/pre>\n<h3>Props: податоци <strong>надолу<\/strong> (parent → child)<\/h3>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;!-- UserCard.vue --&gt;\n&lt;script setup&gt;\ndefineProps({\n  name: { type: String, required: true },\n  age: Number\n})\n&lt;/script&gt;\n&lt;template&gt;\n  &lt;article&gt;&lt;h3&gt;{{ name }}&lt;/h3&gt;&lt;p&gt;{{ age }}&lt;/p&gt;&lt;/article&gt;\n&lt;/template&gt;<\/code><\/pre>\n<ul><li><code>defineProps<\/code> го декларира <strong>јавниот интерфејс<\/strong> на компонентата.<\/li><li>Родителот ги праќа како атрибути (<code>:age<\/code> за израз).<\/li><li><strong>Props се read-only<\/strong> во детето! Не ги менувај.<\/li><\/ul>\n<h3>Emits: настани <strong>нагоре<\/strong> (child → parent)<\/h3>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;!-- CounterButton.vue --&gt;\n&lt;script setup&gt;\nconst emit = defineEmits(['increment'])\n&lt;/script&gt;\n&lt;template&gt;\n  &lt;button @click=\"emit('increment')\"&gt;+1&lt;/button&gt;\n&lt;/template&gt;\n\n&lt;!-- Parent --&gt;\n&lt;CounterButton @increment=\"count++\" /&gt;<\/code><\/pre>\n<p>Детето <strong>кажува што сакал корисникот<\/strong> (emit), а <strong>родителот<\/strong> ја менува заедничката состојба. Може и со податок: <code>emit('add', 2)<\/code> → кај родителот <code>@add=\"total += $event\"<\/code>.<\/p>\n<div class=\"tip\">Правило: <strong>props down, events up<\/strong>.<\/div>\n<h3>Slots: внесување содржина<\/h3>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;!-- Panel.vue template --&gt;\n&lt;section class=\"panel\"&gt;\n  &lt;header&gt;&lt;slot name=\"header\" /&gt;&lt;/header&gt;\n  &lt;main&gt;&lt;slot /&gt;&lt;/main&gt;               &lt;!-- default slot --&gt;\n  &lt;footer&gt;&lt;slot name=\"footer\" /&gt;&lt;/footer&gt;\n&lt;/section&gt;\n\n&lt;!-- Parent --&gt;\n&lt;Panel&gt;\n  &lt;template #header&gt;&lt;h3&gt;Account&lt;/h3&gt;&lt;/template&gt;\n  &lt;p&gt;Reusable content goes here.&lt;/p&gt;   &lt;!-- оди во default slot --&gt;\n  &lt;template #footer&gt;&lt;small&gt;Footer&lt;/small&gt;&lt;/template&gt;\n&lt;/Panel&gt;<\/code><\/pre>\n<ul><li><strong>Default slot<\/strong>: содржината меѓу таговите на компонентата.<\/li><li><strong>Named slots<\/strong> (<code>#header<\/code> = <code>v-slot:header<\/code>): повеќе места за внесување.<\/li><li><strong>Scoped slots<\/strong>: детето <strong>праќа податоци<\/strong> назад до slot содржината на родителот.<\/li><\/ul>\n<h3><code>v-model<\/code> на компонента<\/h3>\n<p>Договор (contract): prop <strong><code>modelValue<\/code><\/strong> + настан <strong><code>update:modelValue<\/code><\/strong>.<\/p>\n<pre class=\"code\" data-lang=\"js\"><code>// рачно\nprops: ['modelValue'], emits: ['update:modelValue']\n// input: value = props.modelValue, onInput → emit('update:modelValue', e.target.value)<\/code><\/pre>\n<p>Полесно со <strong><code>defineModel()<\/code><\/strong>:<\/p>\n<pre class=\"code\" data-lang=\"vue\"><code>&lt;!-- SearchField.vue --&gt;\n&lt;script setup&gt;\nconst model = defineModel({ default: '' })\n&lt;/script&gt;\n&lt;template&gt;&lt;input v-model=\"model\" placeholder=\"Search\"&gt;&lt;/template&gt;\n\n&lt;!-- Parent --&gt;\n&lt;SearchField v-model=\"query\" /&gt;<\/code><\/pre>\n<h3><code>provide<\/code> / <code>inject<\/code><\/h3>\n<p>За да не праќаш prop низ 5 нивоа (prop drilling):<\/p>\n<pre class=\"code\" data-lang=\"js\"><code>// предок\nconst theme = ref('light')\nprovide('theme', theme)\n// длабоко дете\nconst theme = inject('theme')   // theme.value === 'light'<\/code><\/pre>\n<p>За широка заедничка состојба во целата апликација: <strong>Pinia<\/strong>.<\/p>", "qs": [{"id": "v5-1", "t": "mcq", "q": "Во која насока одат <strong>props<\/strong>?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["Од сервер кон компонента", "Меѓу браќа (siblings)", "Од дете кон родител (нагоре)", "Од родител кон дете (надолу)"], "e": "„Props down, events up.“ Родителот праќа props, детето емитува настани."}, {"id": "v5-2", "t": "mcq", "q": "Детето прима prop <code>name<\/code>. Што е правилно?", "code": null, "lang": "js", "run": false, "a": 0, "o": ["Props се <strong>read-only<\/strong> во детето; ако треба промена, детето емитува настан и родителот ја менува состојбата", "Детето мора да го врати prop-от", "Props се копираат, па промената не значи ништо", "Детето може слободно да прави <code>name = 'X'<\/code>"], "e": "Родителот ја поседува состојбата. Детето само го изразува барањето со <code>emit<\/code>."}, {"id": "v5-3", "t": "mcq", "q": "Со што детето <strong>известува<\/strong> родителот дека нешто се случило?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["<code>defineProps<\/code>", "<code>provide<\/code>", "<code>v-show<\/code>", "<code>defineEmits<\/code> и <code>emit('ime')<\/code>"], "e": "<code>const emit = defineEmits(['increment'])<\/code>, па <code>emit('increment')<\/code>. Родителот слуша со <code>@increment=\"...\"<\/code>."}, {"id": "v5-4", "t": "mcq", "q": "Детето прави <code>emit('add', 2)<\/code>. Родителот: <code>&lt;AddButton @add=\"total += $event\" /&gt;<\/code>. Ако <code>total<\/code> бил 0, колку е по 3 клика?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["2", "0", "6", "3"], "e": "<code>$event<\/code> е податокот испратен со emit (тука <code>2<\/code>). 3 клика × 2 = 6."}, {"id": "v5-5", "t": "mcq", "q": "Каде оди <code>&lt;p&gt;Hello&lt;/p&gt;<\/code> во <code>&lt;Panel&gt;&lt;p&gt;Hello&lt;/p&gt;&lt;/Panel&gt;<\/code> ако Panel има <code>&lt;slot /&gt;<\/code>?", "code": null, "lang": "js", "run": false, "a": 3, "o": ["Во header slot", "Како prop <code>p<\/code>", "Никаде, се игнорира", "Во <strong>default slot<\/strong>-от"], "e": "Содржина без <code>#name<\/code> template оди во default slot."}, {"id": "v5-6", "t": "mcq", "q": "Што е <code>&lt;template #header&gt;...&lt;/template&gt;<\/code>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Header на HTML страната", "Нов компонент наречен header", "Содржина за <strong>named slot<\/strong> <code>header<\/code> (кратенка за <code>v-slot:header<\/code>)", "Props објект"], "e": "<code>#<\/code> = <code>v-slot:<\/code>. Named slots овозможуваат повеќе места за внесување содржина."}, {"id": "v5-7", "t": "mcq", "q": "Што се <strong>scoped slots<\/strong>?", "code": null, "lang": "js", "run": false, "a": 0, "o": ["Slots каде детето праќа податоци до slot содржината на родителот", "Slots за грешки", "Slots со scoped CSS", "Slots што работат само во <code>&lt;script setup&gt;<\/code>"], "e": "Пр. листа компонента што го дава секој <code>item<\/code> на родителот за тој да одлучи како да го прикаже."}, {"id": "v5-8", "t": "mcq", "q": "Кој е договорот (contract) за <code>v-model<\/code> на компонента?", "code": null, "lang": "js", "run": false, "a": 0, "o": ["Prop <code>modelValue<\/code> и настан <code>update:modelValue<\/code>", "Само <code>provide<\/code>/<code>inject<\/code>", "Prop <code>model<\/code> и настан <code>model<\/code>", "Prop <code>value<\/code> и настан <code>change<\/code>"], "e": "<code>&lt;Editor v-model=\"title\" /&gt;<\/code> е исто како <code>:modelValue=\"title\" @update:modelValue=\"title = $event\"<\/code>. <code>defineModel()<\/code> го прави тоа автоматски."}, {"id": "v5-9", "t": "mcq", "q": "Што прави <code>defineModel()<\/code>?", "code": null, "lang": "js", "run": false, "a": 2, "o": ["Дефинира
